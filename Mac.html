<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macOS Web Simulator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #0a84ff;
  --win: rgba(246, 246, 248, .93); --win-solid: #fff; --side: rgba(232, 232, 237, .82);
  --text: #1d1d1f; --sub: #6e6e73; --border: rgba(0, 0, 0, .12); --hover: rgba(0, 0, 0, .06);
  --menu: rgba(246, 246, 246, .78); --input: #fff; --field: rgba(0, 0, 0, .05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, "Cascadia Mono", monospace;
}
body.dark {
  --win: rgba(36, 36, 38, .93); --win-solid: #1e1e1e; --side: rgba(48, 48, 52, .82);
  --text: #f5f5f7; --sub: #98989d; --border: rgba(255, 255, 255, .13); --hover: rgba(255, 255, 255, .08);
  --menu: rgba(44, 44, 46, .78); --input: #1c1c1e; --field: rgba(255, 255, 255, .07);
}
html, body { height: 100%; overflow: hidden; background: #000; }
body { font: 13px/1.35 var(--font); color: var(--text); user-select: none; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
body.dragging iframe, body.dragging .window .body { pointer-events: none; }
body.dragging { cursor: default; }

#wall { position: fixed; inset: 0; background-size: cover; transition: background .4s; }
body.dark #wall { filter: brightness(.82); }
#dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 99990; }

/* ---------- boot ---------- */
#boot { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 60px; z-index: 99999; }
.boot-apple { width: 84px; fill: #fff; }
.progress { width: 210px; height: 5px; background: #3a3a3c; border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: #fff; transition: width .15s; }

/* ---------- login ---------- */
#login { position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column; align-items: center; color: #fff; backdrop-filter: blur(24px) saturate(1.3); background: rgba(0, 0, 0, .12); }
.login-clock { margin-top: 9vh; text-align: center; text-shadow: 0 2px 20px rgba(0, 0, 0, .25); }
.lc-date { font-size: 22px; font-weight: 600; opacity: .9; }
.lc-time { font-size: 96px; font-weight: 700; letter-spacing: -2px; line-height: 1.05; }
.login-box { margin-top: auto; margin-bottom: 14vh; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.avatar { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(#c7c7cc, #8e8e93); display: grid; place-items: center; font-size: 50px; box-shadow: 0 6px 24px rgba(0, 0, 0, .3); }
#login-name { background: transparent; border: none; text-align: center; font-size: 20px; font-weight: 600; color: #fff; outline: none; width: 260px; border-bottom: 1px solid transparent; }
#login-name:not(:disabled):hover, #login-name:focus { border-bottom-color: rgba(255, 255, 255, .5); }
#login-go { background: rgba(255, 255, 255, .25); border: 1px solid rgba(255, 255, 255, .3); border-radius: 20px; padding: 7px 22px; color: #fff; cursor: pointer; backdrop-filter: blur(10px); }
#login-go:hover { background: rgba(255, 255, 255, .38); }
.login-hint { font-size: 12px; opacity: .8; max-width: 340px; text-align: center; }
.login-power { position: absolute; bottom: 28px; display: flex; gap: 36px; }
.login-power button { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
.login-power .pw { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: grid; place-items: center; font-size: 18px; }
.login-power button:hover .pw { background: rgba(255, 255, 255, .35); }
#desktop.lowered { filter: blur(6px); }

#shade { position: fixed; inset: 0; z-index: 99995; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #8e8e93; }
#shade.black { background: #000; }
#shade.sleep { cursor: pointer; }
.power-btn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #48484a; background: #1c1c1e; color: #d1d1d6; font-size: 28px; cursor: pointer; }
.power-btn:hover { border-color: #8e8e93; }

/* ---------- menu bar ---------- */
#desktop { position: fixed; inset: 0; }
#menubar { position: absolute; top: 0; left: 0; right: 0; height: 25px; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; z-index: 5000; color: #fff; background: rgba(0, 0, 0, .22); backdrop-filter: blur(30px) saturate(1.6); text-shadow: 0 0 6px rgba(0, 0, 0, .25); font-size: 13.5px; }
body:not(.dark) #menubar { background: rgba(255, 255, 255, .28); color: #1d1d1f; text-shadow: none; }
.mb-left, .mb-right, .mb-menus { display: flex; align-items: center; height: 100%; }
.mb-item { height: 22px; padding: 0 9px; display: flex; align-items: center; gap: 4px; border-radius: 5px; cursor: default; white-space: nowrap; }
.mb-item:hover, .mb-item.open { background: rgba(255, 255, 255, .25); }
body:not(.dark) .mb-item:hover, body:not(.dark) .mb-item.open { background: rgba(0, 0, 0, .1); }
.mb-apple svg { width: 15px; fill: currentColor; }
.mb-app { font-weight: 700; }
.warn-pill { background: #ff9f0a; color: #000; border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 600; text-shadow: none; }
.batt { display: inline-block; width: 24px; height: 11px; border: 1.3px solid currentColor; border-radius: 3px; position: relative; padding: 1px; }
.batt i { display: block; height: 100%; background: currentColor; border-radius: 1px; }
.batt b { position: absolute; inset: -3px 0 0 0; font-size: 10px; text-align: center; color: #ffd60a; }
.batt-pct { font-size: 12px; }

/* ---------- menus ---------- */
.menu { position: fixed; z-index: 20000; min-width: 210px; padding: 5px; border-radius: 9px; background: var(--menu); backdrop-filter: blur(40px) saturate(1.8); border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0, 0, 0, .28); color: var(--text); font-size: 13.5px; animation: pop .12s ease-out; }
.menu-item { display: flex; justify-content: space-between; gap: 24px; padding: 3px 10px 3px 22px; border-radius: 5px; position: relative; white-space: nowrap; }
.menu-item:hover:not(.disabled) { background: var(--accent); color: #fff; }
.menu-item.disabled { opacity: .4; }
.menu-item.checked::before { content: '✓'; position: absolute; left: 6px; }
.menu-item .sc { opacity: .55; font-size: 12px; }
.menu-sep { height: 1px; background: var(--border); margin: 5px 8px; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } }

#cc-panel { position: fixed; top: 30px; right: 8px; width: 310px; padding: 10px; border-radius: 16px; z-index: 20000; background: var(--menu); backdrop-filter: blur(40px) saturate(1.8); border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0, 0, 0, .3); display: flex; flex-direction: column; gap: 8px; animation: pop .12s; }
.cc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cc-tile, .cc-box { background: var(--field); border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 8px; }
.cc-box { flex-direction: column; align-items: stretch; gap: 6px; }
.cc-tile { cursor: pointer; }
.cc-tile small, .cc-box small { display: block; color: var(--sub); font-size: 11px; }
.cc-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--hover); flex: none; }
.cc-btn.on { background: var(--accent); color: #fff; }
.cc-box input[type=range] { width: 100%; accent-color: var(--accent); }

/* ---------- desktop icons ---------- */
#desktop-icons { position: absolute; top: 34px; right: 10px; left: 10px; bottom: 90px; display: flex; flex-direction: column; flex-wrap: wrap-reverse; align-content: flex-start; gap: 4px; pointer-events: none; }
.d-icon { pointer-events: auto; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; border-radius: 6px; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); font-size: 12px; text-align: center; }
.d-icon span { padding: 1px 4px; border-radius: 4px; word-break: break-word; max-width: 100%; }
.d-icon.sel { background: rgba(0, 0, 0, .25); }
.d-icon.sel span { background: var(--accent); text-shadow: none; }

/* ---------- windows ---------- */
#windows { position: absolute; inset: 0; pointer-events: none; }
.window { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: var(--win); backdrop-filter: blur(40px) saturate(1.6); border-radius: 11px; border: 1px solid var(--border); box-shadow: 0 22px 70px rgba(0, 0, 0, .38), 0 0 0 .5px rgba(0, 0, 0, .3); overflow: hidden; transition: opacity .16s, transform .16s; }
.window.inactive { box-shadow: 0 12px 40px rgba(0, 0, 0, .22), 0 0 0 .5px rgba(0, 0, 0, .25); }
.window.opening { animation: winopen .2s ease-out; }
.window.closing { opacity: 0; transform: scale(.94); }
.window.minimized { opacity: 0; transform: translateY(60vh) scale(.1); pointer-events: none; transition: opacity .3s, transform .35s ease-in; }
.window.max { left: 0 !important; top: 25px !important; width: 100% !important; height: calc(100% - 25px - 78px) !important; border-radius: 0; transition: all .22s; }
@keyframes winopen { from { opacity: 0; transform: scale(.93); } }
.titlebar { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; position: relative; border-bottom: 1px solid var(--border); }
.lights { display: flex; gap: 8px; flex: none; z-index: 2; }
.lights button { width: 12px; height: 12px; border-radius: 50%; border: .5px solid rgba(0, 0, 0, .15); cursor: default; position: relative; font-size: 9px; line-height: 11px; color: rgba(0, 0, 0, .6); }
.l-close { background: #ff5f57; } .l-min { background: #febc2e; } .l-max { background: #28c840; }
.window.inactive .lights button { background: #c7c7cc; }
body.dark .window.inactive .lights button { background: #4a4a4e; }
.lights:hover button::after { position: absolute; inset: 0; text-align: center; font-weight: 700; }
.lights:hover .l-close::after { content: '×'; font-size: 11px; }
.lights:hover .l-min::after { content: '−'; }
.lights:hover .l-max::after { content: '+'; }
.title { flex: 1; text-align: center; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.window.inactive .title { opacity: .55; }
.tb-extra { display: flex; align-items: center; gap: 4px; flex: none; }
.tb-extra:empty { display: none; }
.tb-btn { background: none; border: none; min-width: 28px; height: 26px; padding: 0 6px; border-radius: 6px; font-size: 15px; color: var(--sub); cursor: default; }
.tb-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.tb-btn:disabled { opacity: .35; }
.body { flex: 1; min-height: 0; position: relative; overflow: auto; user-select: text; }
.rz { position: absolute; z-index: 5; }
.rz-r { right: 0; top: 0; bottom: 10px; width: 6px; cursor: ew-resize; }
.rz-b { bottom: 0; left: 0; right: 10px; height: 6px; cursor: ns-resize; }
.rz-br { right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
.window.max .rz { display: none; }

/* windows with a full-height sidebar */
.sidebar-win .titlebar { background: linear-gradient(90deg, var(--side) 0 200px, var(--win-solid) 200px); border-bottom-color: transparent; }
.sidebar-win .titlebar::after { content: ''; position: absolute; left: 200px; right: 0; bottom: -1px; height: 1px; background: var(--border); }
.sidebar-win .title { text-align: left; flex: 1; padding-left: 130px; }
.sidebar-win .body { background: var(--win-solid); }

.input, .field { background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; outline: none; }
.input:focus, .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn { background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 4px 14px; cursor: default; box-shadow: 0 1px 1px rgba(0, 0, 0, .06); }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.link { background: none; border: none; color: var(--accent); box-shadow: none; padding: 4px 0; }
.btn.small { padding: 2px 10px; font-size: 12px; }
.btn.danger { color: #ff3b30; }
.ok { color: #28a745; } body.dark .ok { color: #30d158; }
.warn { color: #d97706; } body.dark .warn { color: #ff9f0a; }

/* ---------- dock ---------- */
#dock-wrap { position: absolute; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 4000; }
#dock { pointer-events: auto; display: flex; align-items: flex-end; gap: 4px; padding: 5px 6px; border-radius: 20px; background: var(--dock-bg, rgba(255, 255, 255, .25)); backdrop-filter: blur(30px) saturate(1.6); border: 1px solid rgba(255, 255, 255, .25); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); max-width: calc(100vw - 20px); transition: transform .25s ease; }
body.dark #dock { border-color: rgba(255, 255, 255, .14); }
/* dock on the left / right */
#dock-wrap.pos-left, #dock-wrap.pos-right { top: 25px; bottom: 0; left: 6px; right: auto; flex-direction: column; justify-content: center; }
#dock-wrap.pos-right { left: auto; right: 6px; }
.pos-left #dock, .pos-right #dock { flex-direction: column; align-items: flex-start; max-height: calc(100vh - 40px); max-width: none; padding: 6px 5px; }
.pos-right #dock { align-items: flex-end; }
.pos-left .dock-item, .pos-right .dock-item { flex-direction: row; padding: 0 0 0 6px; }
.pos-right .dock-item { flex-direction: row-reverse; padding: 0 6px 0 0; }
.pos-left .dock-item .dot { left: 0; bottom: auto; top: 50%; }
.pos-right .dock-item .dot { right: 0; left: auto; bottom: auto; top: 50%; }
.pos-left .dock-label { bottom: auto; left: calc(100% + 10px); }
.pos-right .dock-label { bottom: auto; right: calc(100% + 10px); }
.pos-left .dock-sep, .pos-right .dock-sep { width: auto; height: 1px; margin: 4px 6px; align-self: stretch; }
/* auto-hide */
#dock-hot { position: absolute; z-index: 3999; left: 0; right: 0; bottom: 0; height: 6px; }
body[data-dock=left] #dock-hot { top: 25px; right: auto; width: 6px; height: auto; }
body[data-dock=right] #dock-hot { top: 25px; left: auto; width: 6px; height: auto; }
#dock-wrap.autohide:not(.reveal) #dock { transform: translateY(calc(100% + 20px)); }
#dock-wrap.pos-left.autohide:not(.reveal) #dock { transform: translateX(calc(-100% - 20px)); }
#dock-wrap.pos-right.autohide:not(.reveal) #dock { transform: translateX(calc(100% + 20px)); }
body[data-dock=left] .window.max { left: calc(var(--dock-size, 48px) + 28px) !important; width: calc(100% - var(--dock-size, 48px) - 28px) !important; height: calc(100% - 25px) !important; }
body[data-dock=right] .window.max { width: calc(100% - var(--dock-size, 48px) - 28px) !important; height: calc(100% - 25px) !important; }
.dl-icon { background: linear-gradient(#64d2ff, #0a84ff); }
/* reduce transparency */
body.solid .window, body.solid .menu, body.solid #cc-panel, body.solid .toast, body.solid .modal, body.solid #menubar { backdrop-filter: none; }
body.solid { --win: var(--win-solid); --menu: var(--win-solid); }
.dock-item { position: relative; display: flex; flex-direction: column; align-items: center; padding-bottom: 5px; }
.dock-item .icon { transition: width .08s, height .08s; }
.dock-item .dot { position: absolute; bottom: 0; width: 4px; height: 4px; border-radius: 50%; background: transparent; }
.dock-item .dot.on { background: rgba(255, 255, 255, .9); box-shadow: 0 0 2px #000; }
body:not(.dark) .dock-item .dot.on { background: #1d1d1f; box-shadow: none; }
.dock-label { position: absolute; bottom: calc(100% + 10px); background: var(--menu); backdrop-filter: blur(20px); color: var(--text); padding: 3px 10px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .1s; border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(0, 0, 0, .2); }
.dock-item:hover .dock-label { opacity: 1; }
.dock-sep { width: 1px; align-self: stretch; margin: 6px 4px 10px; background: rgba(255, 255, 255, .35); }
.dock-item.bounce .icon { animation: bounce .7s ease; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-20px); } 60% { transform: translateY(0); } 80% { transform: translateY(-8px); } }
.dock-item.mini .icon { opacity: .9; }

/* app icon tile */
.icon { flex: none; border-radius: 23%; display: flex; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 2px 6px rgba(0, 0, 0, .22), inset 0 0 0 .5px rgba(0, 0, 0, .12); overflow: hidden; position: relative; color: #fff; font-weight: 700; }
.icon svg { width: 100%; height: 100%; }
.trash-icon { background: linear-gradient(#f2f2f7, #c7c7cc); font-size: 26px; }

/* ---------- launchpad ---------- */
#launchpad { position: fixed; inset: 0; z-index: 6000; backdrop-filter: blur(40px) brightness(.7); background: rgba(0, 0, 0, .2); display: flex; flex-direction: column; align-items: center; padding: 30px 6vw; opacity: 0; transform: scale(1.06); transition: opacity .18s, transform .18s; }
#launchpad.show { opacity: 1; transform: none; }
.lp-search { width: 240px; padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .15); color: #fff; text-align: center; outline: none; }
.lp-search::placeholder { color: rgba(255, 255, 255, .6); }
.lp-grid { margin-top: 40px; width: 100%; max-width: 1100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 28px 10px; overflow: auto; padding-bottom: 40px; }
.lp-item { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; font-size: 13px; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); cursor: pointer; }
.lp-item:active .icon { filter: brightness(.8); }

/* ---------- spotlight ---------- */
#spotlight { position: fixed; inset: 0; z-index: 7000; display: flex; justify-content: center; }
.sp-box { margin-top: 18vh; width: min(640px, 92vw); align-self: flex-start; background: var(--menu); backdrop-filter: blur(40px) saturate(1.8); border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 20px 70px rgba(0, 0, 0, .4); overflow: hidden; color: var(--text); }
.sp-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: var(--sub); }
.sp-bar input { flex: 1; background: none; border: none; outline: none; font-size: 22px; color: var(--text); }
.sp-res { border-top: 1px solid var(--border); max-height: 50vh; overflow: auto; padding: 6px; }
.sp-item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; }
.sp-item.sel { background: var(--accent); color: #fff; }
.sp-item small { display: block; opacity: .65; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 480px; }

/* ---------- toasts & modals ---------- */
#toasts { position: fixed; top: 34px; right: 12px; z-index: 8000; display: flex; flex-direction: column; gap: 8px; width: 340px; pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 14px; background: var(--menu); backdrop-filter: blur(40px) saturate(1.8); border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0, 0, 0, .25); color: var(--text); animation: slidein .3s ease-out; transition: opacity .4s, transform .4s; }
.toast.out { opacity: 0; transform: translateX(30px); }
.t-icon { font-size: 26px; line-height: 1; }
.toast p { color: var(--sub); font-size: 12.5px; margin-top: 2px; }
@keyframes slidein { from { opacity: 0; transform: translateX(40px); } }
.modal-ov { position: fixed; inset: 0; z-index: 30000; background: rgba(0, 0, 0, .15); display: flex; justify-content: center; align-items: flex-start; padding-top: 16vh; }
.modal { width: 320px; background: var(--menu); backdrop-filter: blur(50px) saturate(1.8); border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 20px 70px rgba(0, 0, 0, .4); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text); text-align: center; animation: pop .15s; }
.m-icon svg { width: 40px; fill: var(--text); }
.m-title { font-weight: 700; font-size: 14px; }
.m-msg { font-size: 12.5px; color: var(--sub); white-space: pre-line; }
.m-input, .m-sel { width: 100%; background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; outline: none; }
.m-input:focus { border-color: var(--accent); }
.m-row { display: flex; align-items: center; gap: 8px; width: 100%; white-space: nowrap; font-size: 12.5px; }
.m-warn { font-size: 12px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; }
.m-warn.ok { background: rgba(48, 209, 88, .15); }
.m-warn.bad { background: rgba(255, 159, 10, .18); }
.m-btns { display: flex; gap: 8px; width: 100%; justify-content: stretch; margin-top: 4px; }
.m-btns .btn:not(.link) { flex: 1; }

/* ---------- Finder ---------- */
.f-wrap { display: flex; height: 100%; }
.f-side, .n-side, .st-side, .as-side { width: 200px; flex: none; background: var(--side); overflow: auto; padding: 4px 10px 10px; user-select: none; }
.side-h { font-size: 11px; font-weight: 700; color: var(--sub); margin: 12px 6px 4px; }
.side-i { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-i:hover { background: var(--hover); }
.side-i.on { background: rgba(0, 0, 0, .1); font-weight: 500; }
body.dark .side-i.on { background: rgba(255, 255, 255, .12); }
.side-i .eject { margin-left: auto; opacity: .6; padding: 0 4px; }
.side-i .eject:hover { opacity: 1; }
.side-i.connect { color: var(--accent); }
.f-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.f-grid { flex: 1; overflow: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); align-content: start; gap: 8px; user-select: none; outline: none; }
.f-grid.list { display: block; padding: 4px 8px; }
.f-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border-radius: 8px; text-align: center; font-size: 12px; }
.f-item span { word-break: break-word; padding: 1px 4px; border-radius: 4px; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.f-item.sel { background: var(--hover); }
.f-item.sel span { background: var(--accent); color: #fff; }
.f-grid.list .f-item { flex-direction: row; gap: 8px; text-align: left; padding: 2px 8px; border-radius: 5px; }
.f-grid.list .f-item:nth-child(odd) { background: var(--field); }
.f-grid.list .f-item.sel { background: var(--accent); color: #fff; }
.f-grid.list .f-item span { flex: 1; -webkit-line-clamp: 1; }
.f-grid.list .f-item em { font-style: normal; color: var(--sub); font-size: 11.5px; width: 130px; }
.f-grid.list .f-item.sel em { color: #fff; }
.f-grid:not(.list) .f-item em { display: none; }
.f-grid.drop { box-shadow: inset 0 0 0 3px var(--accent); }
.f-empty { grid-column: 1 / -1; text-align: center; color: var(--sub); margin-top: 60px; }
.f-status { flex: none; border-top: 1px solid var(--border); padding: 4px 12px; font-size: 11.5px; color: var(--sub); display: flex; justify-content: space-between; gap: 10px; }
.f-search { width: 150px; height: 24px; }
.f-path { font-size: 11.5px; color: var(--sub); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---------- Terminal ---------- */
.terminal { background: rgba(30, 30, 30, .94); color: #e5e5e5; border-color: rgba(255, 255, 255, .15); }
.terminal .titlebar { border-bottom-color: rgba(0, 0, 0, .4); background: #2b2b2b; color: #ccc; }
.terminal .body { background: transparent; }
.term { height: 100%; overflow: auto; padding: 6px 8px; font: 13px/1.45 var(--mono); cursor: text; }
.term-out div { white-space: pre-wrap; word-break: break-all; }
.term-line { display: flex; }
.term-ps { white-space: pre; color: #e5e5e5; }
.term-in { flex: 1; background: none; border: none; outline: none; color: #e5e5e5; font: inherit; caret-color: #e5e5e5; padding: 0; }
.term .err { color: #ff6b6b; }
.term .dim { color: #8e8e93; }
.term .acc { color: #5ac8fa; }
.term .grn { color: #30d158; }

/* ---------- editors ---------- */
.te-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--win); font-size: 12px; }
.te-bar .grow { flex: 1; }
.te-text { width: 100%; height: calc(100% - 37px); border: none; outline: none; resize: none; padding: 16px 22px; background: var(--win-solid); font-size: 14px; line-height: 1.5; }
.te-text.mono { font-family: var(--mono); font-size: 13px; }
.te-save-state { font-size: 11.5px; }

/* ---------- Notes ---------- */
.notes .titlebar { background: linear-gradient(90deg, var(--side) 0 230px, var(--win-solid) 230px); }
.notes .titlebar::after { left: 230px; }
.n-wrap { display: flex; height: 100%; }
.n-side { width: 230px; padding: 6px; }
.n-item { padding: 8px 10px; border-radius: 7px; margin-bottom: 2px; }
.n-item b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n-item small { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.n-item.on { background: #ffd60a; color: #000; }
.n-item.on small { color: rgba(0, 0, 0, .6); }
.n-main { flex: 1; display: flex; flex-direction: column; }
.n-text { flex: 1; border: none; outline: none; resize: none; padding: 18px 24px; background: var(--win-solid); font-size: 15px; line-height: 1.55; }
.n-foot { font-size: 11px; color: var(--sub); padding: 4px 12px; border-top: 1px solid var(--border); }

/* ---------- Safari ---------- */
.safari .titlebar { height: 46px; }
.safari .title { display: none; }
.safari .tb-extra { flex: 1; }
.s-url { flex: 1; height: 30px; border-radius: 8px; border: 1px solid transparent; background: var(--field); text-align: center; padding: 0 12px; outline: none; }
.s-url:focus { text-align: left; border-color: var(--accent); background: var(--input); }
.safari .body { display: flex; flex-direction: column; background: var(--win-solid); }
.s-frame { flex: 1; border: none; width: 100%; background: #fff; }
.s-start { flex: 1; overflow: auto; padding: 50px 40px; }
.s-start h2 { font-size: 22px; margin-bottom: 18px; }
.s-favs { display: grid; grid-template-columns: repeat(auto-fill, 90px); gap: 22px; }
.s-fav { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; text-align: center; cursor: pointer; }
.s-fav .icon { width: 64px; height: 64px; font-size: 30px; }
.s-note { font-size: 11.5px; color: var(--sub); padding: 4px 10px; border-top: 1px solid var(--border); }

/* ---------- Calculator ---------- */
.calc-win { background: rgba(40, 40, 40, .96); border-color: rgba(255, 255, 255, .1); }
.calc-win .titlebar { border: none; }
.calc { display: flex; flex-direction: column; height: 100%; color: #fff; user-select: none; outline: none; }
.calc-d { flex: 1; display: flex; align-items: flex-end; justify-content: flex-end; font-size: 46px; font-weight: 300; padding: 0 16px 4px; overflow: hidden; white-space: nowrap; }
.calc-k { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(0, 0, 0, .4); }
.calc-k button { height: 48px; border: none; background: #5a5a5c; color: #fff; font-size: 20px; cursor: default; }
.calc-k button:active { filter: brightness(1.3); }
.calc-k .fn { background: #48484a; }
.calc-k .op { background: #ff9f0a; font-size: 24px; }
.calc-k .op.on { background: #fff; color: #ff9f0a; }
.calc-k .zero { grid-column: span 2; text-align: left; padding-left: 22px; }

/* ---------- Settings / App Store ---------- */
.st-wrap, .as-wrap { display: flex; height: 100%; }
.st-main, .as-main { flex: 1; overflow: auto; padding: 22px 28px; }
.st-main h2, .as-main h2 { font-size: 20px; margin-bottom: 14px; }
.st-group { background: var(--field); border-radius: 10px; padding: 4px 14px; margin-bottom: 18px; }
.st-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.st-row:last-child { border-bottom: none; }
.st-row small { display: block; color: var(--sub); font-size: 11.5px; }
.wp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.wp { aspect-ratio: 16/10; border-radius: 9px; border: 3px solid transparent; cursor: pointer; display: flex; align-items: flex-end; padding: 6px; color: #fff; font-size: 11.5px; font-weight: 600; text-shadow: 0 1px 3px #000; background-size: cover !important; }
.wp.on { border-color: var(--accent); }
.accents { display: flex; gap: 8px; }
.accents i { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
.accents i.on { box-shadow: 0 0 0 2px var(--win-solid), 0 0 0 4px currentColor; }
.seg { display: inline-flex; background: var(--hover); border-radius: 7px; padding: 2px; }
.seg button { border: none; background: none; padding: 3px 14px; border-radius: 5px; }
.seg button.on { background: var(--input); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.switch { width: 38px; height: 22px; border-radius: 11px; background: var(--hover); position: relative; border: none; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: left .15s; }
.switch.on { background: var(--accent); }
.switch.on::after { left: 18px; }
.as-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.as-card { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--field); }
.as-card .icon { width: 58px; height: 58px; font-size: 32px; }
.as-card .meta { flex: 1; min-width: 0; }
.as-card .meta b { display: block; }
.as-card .meta small { color: var(--sub); font-size: 11.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.get-btn { border: none; background: var(--hover); color: var(--accent); font-weight: 700; border-radius: 14px; padding: 4px 16px; font-size: 12.5px; min-width: 70px; position: relative; overflow: hidden; }
.get-btn.open { background: var(--accent); color: #fff; }
.get-btn .bar { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.as-hero { border-radius: 14px; padding: 26px; color: #fff; margin-bottom: 22px; background: linear-gradient(120deg, #5e5ce6, #bf5af2 50%, #ff375f); }
.as-hero h1 { font-size: 26px; }
.as-form { display: grid; gap: 8px; max-width: 420px; }

/* ---------- misc apps ---------- */
.info { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.info h3 { font-size: 15px; word-break: break-all; text-align: center; }
.info dl { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; font-size: 12px; width: 100%; margin-top: 8px; }
.info dt { color: var(--sub); text-align: right; }
.info dd { word-break: break-all; }
.about { display: flex; flex-direction: column; align-items: center; padding: 22px; gap: 6px; text-align: center; }
.about .mac { font-size: 64px; }
.about h2 { font-size: 22px; }
.about dl { display: grid; grid-template-columns: auto auto; gap: 4px 10px; font-size: 12px; margin-top: 10px; text-align: left; }
.about dt { text-align: right; font-weight: 600; }
.pv { height: 100%; display: flex; align-items: center; justify-content: center; background: var(--win-solid); overflow: auto; }
.pv img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pv iframe { width: 100%; height: 100%; border: none; }
.qt { height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
.qt video { max-width: 100%; max-height: 100%; }
.qt.audio { flex-direction: column; gap: 20px; color: #fff; background: linear-gradient(160deg, #2c2c2e, #000); }

.qt.audio audio { width: 80%; }
@keyframes spin { to { transform: rotate(360deg); } }
.am table { width: 100%; border-collapse: collapse; font-size: 12px; }
.am th { text-align: left; color: var(--sub); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--win-solid); }
.am td { padding: 5px 10px; }
.am tr:nth-child(even) td { background: var(--field); }
.am tr.sel td { background: var(--accent); color: #fff; }
.am .body, .am-wrap { background: var(--win-solid); height: 100%; overflow: auto; }

/* Code Studio */
.cs { display: flex; flex-direction: column; height: 100%; background: #1e1e1e; color: #d4d4d4; }
.cs-bar { display: flex; gap: 6px; align-items: center; padding: 5px 8px; background: #2d2d2d; font-size: 12px; flex: none; }
.cs-bar .btn { background: #3c3c3c; color: #ddd; border-color: #555; padding: 2px 10px; }
.cs-bar .btn.primary { background: #0e639c; border-color: #1177bb; }
.cs-bar .btn:disabled { opacity: .4; }
.cs-split { flex: 1; display: flex; min-height: 0; }
.cs-tree { width: 190px; flex: none; background: #252526; overflow: auto; font-size: 12.5px; padding-bottom: 8px; user-select: none; }
.cs-th { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #bbb; padding: 8px 10px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cs-tactions { display: flex; gap: 4px; padding: 8px 8px 0; }
.cs-tree .btn { background: #3c3c3c; color: #ddd; border-color: #555; }
.cs-ed { flex: 1; display: flex; min-width: 0; }
.cs-ln { padding: 10px 6px; text-align: right; color: #6e7681; font: 13px/20px var(--mono); user-select: none; overflow: hidden; min-width: 44px; background: #1e1e1e; }
.cs-ta { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; outline: none; resize: none; padding: 10px; font: 13px/20px var(--mono); white-space: pre; tab-size: 4; caret-color: #aeafad; }
.cs-out { width: 42%; min-width: 220px; border-left: 1px solid #333; display: flex; flex-direction: column; background: #1e1e1e; }
.cs-tabs { display: flex; align-items: center; padding: 4px 8px; background: #252526; font-size: 11px; text-transform: uppercase; color: #bbb; }
.cs-tabs .btn { background: #3c3c3c; color: #ddd; border-color: #555; padding: 0 8px; font-size: 11px; }
.cs-out iframe { flex: 2; border: none; background: #fff; }
.cs-con { flex: 1; min-height: 60px; background: #181818; color: #ccc; font: 12.5px/1.45 var(--mono); padding: 8px; overflow: auto; white-space: pre-wrap; word-break: break-word; user-select: text; }
.cs-con .err { color: #f48771; } .cs-con .dim { color: #858585; } .cs-con .ok { color: #89d185; }
.cs-in input { width: 100%; background: #252526; color: #ddd; border: none; border-top: 1px solid #333; padding: 6px 8px; font: 12px var(--mono); outline: none; }
.cs-in input.wait { background: #3a3d1e; box-shadow: inset 0 0 0 1px #cca700; }
.cs-status { display: flex; gap: 18px; padding: 2px 10px; background: #007acc; color: #fff; font-size: 11.5px; flex: none; white-space: nowrap; overflow: hidden; }
.cs-status .cs-where { margin-left: auto; opacity: .85; overflow: hidden; text-overflow: ellipsis; }

/* SQLite Studio, HTTP Client, Dev Toolbox, Markdown */
.sq, .hc, .md { display: flex; flex-direction: column; height: 100%; background: var(--win-solid); }
.sq-main { flex: 1; display: flex; min-height: 0; }
.sq-tables { width: 180px; background: var(--side); overflow: auto; font-size: 12.5px; }
.sq-tables .cs-th { color: var(--sub); }
.sq-tables .cs-ti:hover { background: var(--hover); }
.sq-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sq-q { height: 32%; border: none; border-bottom: 1px solid var(--border); padding: 10px; font: 13px/1.5 var(--mono); resize: vertical; outline: none; background: var(--win-solid); }
.sq-res { flex: 1; overflow: auto; padding: 10px; font-size: 12.5px; user-select: text; }
.sq-res table, .am table { border-collapse: collapse; }
.sq-res th, .sq-res td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; font-family: var(--mono); font-size: 12px; }
.sq-res th { background: var(--field); position: sticky; top: 0; }
.dim { color: var(--sub); } .err { color: #ff453a; }
.hc { padding: 12px; gap: 10px; }
.hc-top { display: flex; gap: 6px; }
.hc-url { flex: 1; font-family: var(--mono); }
.hc-cols { flex: 1; display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; min-height: 0; }
.hc-cols > div { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.hc-h, .hc-b { flex: 1; font: 12px/1.5 var(--mono); border: 1px solid var(--border); border-radius: 6px; padding: 8px; resize: none; outline: none; background: var(--input); }
.hc-out { flex: 1; overflow: auto; font: 12px/1.5 var(--mono); background: var(--field); border-radius: 6px; padding: 8px; margin: 0; white-space: pre-wrap; word-break: break-word; user-select: text; }
.hc-meta { font-size: 13px; }
.dt h2 { margin-bottom: 10px; }
.dt-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.dt textarea, .dt-hl, .dt-diff, .dt-cout { width: 100%; min-height: 130px; font: 12.5px/1.5 var(--mono); border: 1px solid var(--border); border-radius: 6px; padding: 8px; background: var(--input); outline: none; resize: vertical; white-space: pre-wrap; word-break: break-word; user-select: text; }
.dt textarea.err { color: #ff453a; }
.dt-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.dt-hl mark { background: #ffd60a; color: #000; border-radius: 2px; }
.md-split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.md-ta { border: none; border-right: 1px solid var(--border); padding: 16px; font: 14px/1.6 var(--mono); resize: none; outline: none; background: var(--win-solid); }
.md-pv { overflow: auto; padding: 16px 22px; font-size: 14.5px; line-height: 1.6; user-select: text; }

.md-pv pre { background: var(--field) !important; }
.md-pv code { background: var(--field); padding: 1px 4px; border-radius: 4px; font-family: var(--mono); }
.md-pv table { border-color: var(--border); }

/* Paint */
.pt { display: flex; flex-direction: column; height: 100%; background: var(--win-solid); }
.pt-bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.pt-bar .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; }
.pt-bar .sw.on { border-color: var(--text); }
.pt-canvas { flex: 1; position: relative; background: #e5e5ea; overflow: hidden; }
.pt-canvas canvas { position: absolute; inset: 0; background: #fff; cursor: crosshair; touch-action: none; }

/* small apps */
.center-app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--win-solid); }
.clock-app { background: #000; color: #fff; }
.clock-cities { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 22px; font-size: 12px; }
.clock-cities b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.clock-cities small { color: #8e8e93; }
.cal { padding: 16px; height: 100%; background: var(--win-solid); display: flex; flex-direction: column; }
.cal-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-h h2 { flex: 1; font-size: 20px; }
.cal-h h2 span { color: #ff3b30; }
.cal-g { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
.cal-g div { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px 6px; font-size: 12px; text-align: right; }
.cal-g .dow { font-weight: 600; color: var(--sub); text-align: center; padding: 4px; }
.cal-g .other { color: var(--sub); opacity: .5; }
.cal-g .today span { background: #ff3b30; color: #fff; border-radius: 50%; display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; }
.sticky { background: #fff59d; }
.sticky .titlebar { background: #fef08a; border-bottom-color: rgba(0, 0, 0, .08); color: #000; height: 28px; }
.sticky .title { font-size: 11px; }
.sticky textarea { width: 100%; height: 100%; border: none; outline: none; resize: none; background: transparent; padding: 10px 12px; font: 15px/1.4 "Marker Felt", "Comic Sans MS", "Segoe Print", cursive; color: #222; }
.wx { height: 100%; color: #fff; background: linear-gradient(170deg, #3a7bd5, #5ec3f2); padding: 18px; overflow: auto; text-align: center; }
.wx input { width: 100%; padding: 6px 10px; border-radius: 8px; border: none; background: rgba(255, 255, 255, .25); color: #fff; outline: none; }
.wx input::placeholder { color: rgba(255, 255, 255, .8); }
.wx .now { margin: 18px 0; }
.wx .now .t { font-size: 64px; font-weight: 200; }
.wx .days { display: flex; flex-direction: column; gap: 2px; background: rgba(255, 255, 255, .15); border-radius: 12px; padding: 8px 12px; text-align: left; }
.wx .days div { display: flex; justify-content: space-between; padding: 4px 0; }
.game { height: 100%; background: #1c1c1e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; outline: none; }
.game canvas { background: #111; border-radius: 6px; }

/* Safari extras */
.s-bm-bar { display: flex; gap: 2px; padding: 3px 8px; border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; background: var(--win); }
.s-bm-bar span { padding: 2px 8px; border-radius: 5px; font-size: 12px; white-space: nowrap; cursor: default; }
.s-bm-bar span:hover { background: var(--hover); }
.s-loading { height: 2px; background: var(--accent); width: 0; transition: width .4s; flex: none; }

.s-loading.done { width: 100%; opacity: 0; transition: width .2s, opacity .4s .2s; }
.s-start .s-search { width: min(560px, 100%); height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--input); padding: 0 16px; font-size: 15px; outline: none; display: block; margin: 0 auto 34px; }

.s-start h2 { margin-top: 26px; }
.s-fav .x { display: none; }
.s-fav:hover .x { display: inline; position: absolute; margin: -6px 0 0 50px; background: #8e8e93; color: #fff; border-radius: 50%; width: 16px; height: 16px; font-size: 11px; line-height: 16px; text-align: center; }

<script>
/* js/vfs.js */
// Virtual File System
// Everything lives in memory and is wiped on restart, EXCEPT folders that are
// mounted from your real computer under /Volumes (via "Connect Drive").
const VFS = (() => {
  const newDir = name => ({ type: 'dir', name, children: {}, mtime: Date.now() });
  let root = newDir('');
  let home = '/Users/guest';
  const listeners = new Set();
  const emit = path => listeners.forEach(f => { try { f(path); } catch (e) { console.error(e); } });
  const ENOENT = p => new Error(`No such file or directory: ${p}`);

  function norm(path, cwd = home) {
    if (path == null || path === '') path = cwd;
    path = String(path);
    if (path === '~' || path.startsWith('~/')) path = home + path.slice(1);
    if (!path.startsWith('/')) path = cwd.replace(/\/$/, '') + '/' + path;
    const out = [];
    for (const p of path.split('/')) {
      if (!p || p === '.') continue;
      if (p === '..') out.pop(); else out.push(p);
    }
    return '/' + out.join('/');
  }
  const split = p => norm(p).split('/').filter(Boolean);
  const dirname = p => { const s = split(p); s.pop(); return '/' + s.join('/'); };
  const basename = p => split(p).pop() || '/';
  const join = (a, b) => norm(b, a);
  const ext = p => { const b = basename(p); const i = b.lastIndexOf('.'); return i > 0 ? b.slice(i + 1).toLowerCase() : ''; };
  const sizeOf = c => c == null ? 0 : typeof c === 'string' ? new Blob([c]).size : c.size;
  const byName = (a, b) => (b.type === 'dir') - (a.type === 'dir') || a.name.localeCompare(b.name, undefined, { numeric: true });

  // Walk the memory tree. Returns {node} or {mount, rest} (inside a real folder) or null.
  function locate(path) {
    const ps = split(path);
    let node = root;
    for (let i = 0; i < ps.length; i++) {
      if (node.type === 'mount') return { mount: node, rest: ps.slice(i) };
      if (node.type !== 'dir') return null;
      node = node.children[ps[i]];
      if (!node) return null;
    }
    if (node.type === 'mount') return { mount: node, rest: [] };
    return { node };
  }

  // --- real-folder (File System Access API) helpers ---
  async function hDir(handle, rest, create = false) {
    let h = handle;
    for (const p of rest) h = await h.getDirectoryHandle(p, { create });
    return h;
  }
  async function hEntry(handle, rest) {
    if (!rest.length) return handle;
    let parent;
    try { parent = await hDir(handle, rest.slice(0, -1)); } catch { return null; }
    const name = rest[rest.length - 1];
    try { return await parent.getDirectoryHandle(name); } catch {}
    try { return await parent.getFileHandle(name); } catch {}
    return null;
  }

  async function stat(path) {
    const loc = locate(path);
    if (!loc) return null;
    if (loc.node) {
      const n = loc.node;
      return { type: n.type, size: n.type === 'file' ? sizeOf(n.content) : 0, mtime: n.mtime, app: n.app };
    }
    try {
      const h = await hEntry(loc.mount.handle, loc.rest);
      if (!h) return null;
      if (h.kind === 'directory') return { type: 'dir', mount: !loc.rest.length, size: 0, mtime: loc.mount.mtime };
      const f = await h.getFile();
      return { type: 'file', size: f.size, mtime: f.lastModified };
    } catch { return null; }
  }

  async function list(path) {
    const p = norm(path);
    const loc = locate(p);
    if (!loc) throw ENOENT(p);
    if (loc.node) {
      if (loc.node.type !== 'dir') throw new Error(`Not a directory: ${p}`);
      return Object.values(loc.node.children).map(n => ({
        name: n.name, path: join(p, n.name),
        type: n.type === 'mount' ? 'dir' : n.type, mount: n.type === 'mount',
        size: n.type === 'file' ? sizeOf(n.content) : 0, mtime: n.mtime, app: n.app,
      })).sort(byName);
    }
    let dir;
    try { dir = await hDir(loc.mount.handle, loc.rest); } catch { throw ENOENT(p); }
    const out = [];
    for await (const [name, h] of dir.entries()) {
      let size = 0, mtime = 0;
      if (h.kind === 'file') { try { const f = await h.getFile(); size = f.size; mtime = f.lastModified; } catch {} }
      out.push({ name, path: join(p, name), type: h.kind === 'directory' ? 'dir' : 'file', size, mtime });
    }
    return out.sort(byName);
  }

  async function readBlob(path) {
    const p = norm(path);
    const loc = locate(p);
    if (!loc) throw ENOENT(p);
    if (loc.node) {
      if (loc.node.type !== 'file') throw new Error(`Is a directory: ${p}`);
      const c = loc.node.content;
      return c instanceof Blob ? c : new Blob([c ?? '']);
    }
    const h = await hEntry(loc.mount.handle, loc.rest);
    if (!h) throw ENOENT(p);
    if (h.kind !== 'file') throw new Error(`Is a directory: ${p}`);
    return h.getFile();
  }
  const read = async path => (await readBlob(path)).text();

  async function write(path, data) {
    const p = norm(path);
    const parent = locate(dirname(p));
    const name = basename(p);
    if (!parent) throw ENOENT(dirname(p));
    if (parent.node) {
      if (parent.node.type !== 'dir') throw new Error(`Not a directory: ${dirname(p)}`);
      const ex = parent.node.children[name];
      if (ex && ex.type !== 'file') throw new Error(`Is a directory: ${p}`);
      parent.node.children[name] = { type: 'file', name, content: data, mtime: Date.now() };
    } else {
      const dir = await hDir(parent.mount.handle, parent.rest);
      const fh = await dir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(data);
      await w.close();
    }
    emit(dirname(p));
  }

  async function mkdir(path) {
    const ps = split(path);
    let node = root;
    for (let i = 0; i < ps.length; i++) {
      if (node.type === 'mount') { await hDir(node.handle, ps.slice(i), true); break; }
      if (node.type !== 'dir') throw new Error(`Not a directory: ${ps.slice(0, i).join('/')}`);
      if (!node.children[ps[i]]) node.children[ps[i]] = newDir(ps[i]);
      node = node.children[ps[i]];
    }
    emit(dirname(path));
  }

  async function rm(path) {
    const p = norm(path);
    if (p === '/') throw new Error('Operation not permitted');
    const parent = locate(dirname(p));
    const name = basename(p);
    if (!parent) throw ENOENT(p);
    if (parent.node) {
      const n = parent.node.children?.[name];
      if (!n) throw ENOENT(p);
      if (n.type === 'mount') throw new Error('Drives must be ejected, not deleted');
      delete parent.node.children[name];
    } else {
      const dir = await hDir(parent.mount.handle, parent.rest);
      await dir.removeEntry(name, { recursive: true });
    }
    emit(dirname(p));
  }

  async function copy(from, to) {
    from = norm(from); to = norm(to);
    if (to === from || to.startsWith(from + '/')) throw new Error('Cannot copy a folder into itself');
    const s = await stat(from);
    if (!s) throw ENOENT(from);
    if (s.type === 'dir') {
      await mkdir(to);
      for (const c of await list(from)) await copy(c.path, join(to, c.name));
    } else if (s.type === 'file') {
      await write(to, await readBlob(from));
    }
  }

  async function move(from, to) {
    from = norm(from); to = norm(to);
    if (from === to) return;
    if (to.startsWith(from + '/')) throw new Error('Cannot move a folder into itself');
    const a = locate(from), pa = locate(dirname(from)), pb = locate(dirname(to));
    if (a?.node && pa?.node && pb?.node && pb.node.type === 'dir') {
      if (a.node.type === 'mount') throw new Error('Drives cannot be moved');
      delete pa.node.children[a.node.name];
      a.node.name = basename(to);
      a.node.mtime = Date.now();
      pb.node.children[a.node.name] = a.node;
      emit(dirname(from)); emit(dirname(to));
      return;
    }
    await copy(from, to);
    await rm(from);
  }

  async function uniquePath(dir, base) {
    const dot = base.lastIndexOf('.');
    const stem = dot > 0 ? base.slice(0, dot) : base, ex = dot > 0 ? base.slice(dot) : '';
    let p = join(dir, base), i = 2;
    while (await stat(p)) p = join(dir, `${stem} ${i++}${ex}`);
    return p;
  }

  // --- drives ---
  function mount(name, handle) {
    const vol = root.children.Volumes;
    let n = name, i = 2;
    while (vol.children[n]) n = `${name} ${i++}`;
    vol.children[n] = { type: 'mount', name: n, handle, mtime: Date.now() };
    emit('/Volumes');
    return '/Volumes/' + n;
  }
  function unmount(name) { delete root.children.Volumes.children[name]; emit('/Volumes'); }
  const mounts = () => Object.values(root.children.Volumes?.children || {})
    .filter(n => n.type === 'mount').map(n => ({ name: n.name, path: '/Volumes/' + n.name }));

  // /Applications is rebuilt from the list of installed apps
  function setApps(apps) {
    const d = root.children.Applications;
    d.children = {};
    for (const a of apps) d.children[a.name + '.app'] = { type: 'app', name: a.name + '.app', app: a.id, mtime: Date.now() };
    emit('/Applications');
  }

  // search names in the memory tree (drives are skipped for speed)
  function search(q, max = 20) {
    q = q.toLowerCase();
    const out = [];
    (function walk(node, path) {
      for (const c of Object.values(node.children)) {
        if (out.length >= max) return;
        const p = path + '/' + c.name;
        if (c.name.startsWith('.')) continue;
        if (c.name.toLowerCase().includes(q) && c.type !== 'app') out.push({ name: c.name, path: p, type: c.type === 'mount' ? 'dir' : c.type, mount: c.type === 'mount' });
        if (c.type === 'dir') walk(c, p);
      }
    })(root, '');
    return out;
  }

  function init(user) {
    const u = (user || 'guest').toLowerCase().replace(/[^a-z0-9]/g, '') || 'guest';
    home = '/Users/' + u;
    root = newDir('');
    const H = newDir(u);
    for (const d of ['Desktop', 'Documents', 'Downloads', 'Pictures', 'Music', 'Movies', '.Trash']) H.children[d] = newDir(d);
    root.children = {
      Applications: newDir('Applications'),
      System: newDir('System'),
      Users: Object.assign(newDir('Users'), { children: { [u]: H, Shared: newDir('Shared') } }),
      Volumes: newDir('Volumes'),
    };
    const file = (dir, name, content) => { dir.children[name] = { type: 'file', name, content, mtime: Date.now() }; };
    file(H.children.Desktop, 'Welcome.txt',
`Welcome to your Mac (simulation)!

• This Mac runs entirely in your browser's memory.
• Anything you create here is ERASED when you restart, shut down or close the tab.
• To keep files, click "Connect Drive" (Finder sidebar, the menu bar, or Settings → Storage)
  and pick a folder on your computer. It appears under /Volumes and on the Desktop.
  Everything saved there is written to your real disk.
• Get more apps from the App Store, or in Terminal: brew install paint

Shortcuts: Ctrl+Space = Spotlight · Alt+L = Launchpad · Alt+W = close window · Alt+M = minimize
`);
    file(H.children.Documents, 'Ideas.md', '# Ideas\n\n- Build something cool\n- Try Terminal: `neofetch`\n');
    file(H.children.Documents, 'hello.html', '<!doctype html>\n<h1 style="font-family:sans-serif;color:#0a84ff">Hello from your virtual Mac!</h1>\n<p>Open me in Safari or Code Studio.</p>\n');
    file(root.children.System, 'version.txt', 'macOS Web Simulator 15.0\n');
    emit('/');
  }

  return {
    norm, dirname, basename, join, ext, list, stat, read, readBlob, write, mkdir, rm, copy, move,
    uniquePath, mount, unmount, mounts, setApps, search, init,
    onChange: f => { listeners.add(f); return () => listeners.delete(f); },
    get home() { return home; },
    isPersistent: p => norm(p).startsWith('/Volumes/'),
  };
})();

</script>
<script>
/* js/sound.js */
// System sounds, synthesized with the Web Audio API (no audio files needed)
const Sound = (() => {
  let ctx = null;
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const vol = () => (OS.state.soundOn === false ? 0 : (OS.state.volume ?? 0.6));

  // one tone with an envelope
  function tone(freq, start, dur, { type = 'sine', gain = 0.3, attack = 0.005, glide } = {}) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain * vol()), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(start, dur, gain = 0.2, hp = 1200) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + start, b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.3 ? 1 : 0.3);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(gain * vol(), t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  }

  // alert sounds you can pick in Settings → Sound
  const ALERTS = {
    Glass: () => { tone(1568, 0, 0.9, { gain: 0.25 }); tone(2093, 0.02, 0.7, { gain: 0.12 }); tone(3136, 0.04, 0.4, { gain: 0.05 }); },
    Ping: () => { tone(1760, 0, 0.5, { gain: 0.3 }); tone(3520, 0, 0.25, { gain: 0.06 }); },
    Pop: () => tone(600, 0, 0.12, { gain: 0.4, glide: 180 }),
    Funk: () => { tone(220, 0, 0.25, { type: 'triangle', gain: 0.4, glide: 140 }); tone(330, 0.08, 0.2, { type: 'triangle', gain: 0.2, glide: 200 }); },
    Hero: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.07, 0.6, { type: 'triangle', gain: 0.18 })),
    Tink: () => tone(2637, 0, 0.18, { gain: 0.25 }),
    Submarine: () => { tone(392, 0, 0.9, { gain: 0.3 }); tone(784, 0, 0.5, { gain: 0.08 }); },
  };

  const SFX = {
    startup: () => [174.6, 261.6, 349.2, 440, 523.3, 698.5].forEach((f, i) => tone(f, i * 0.012, 2.6, { type: i % 2 ? 'triangle' : 'sine', gain: 0.12, attack: 0.04 })),
    open: () => tone(880, 0, 0.08, { gain: 0.08, glide: 1320 }),
    close: () => tone(1100, 0, 0.07, { gain: 0.06, glide: 700 }),
    minimize: () => tone(1200, 0, 0.25, { gain: 0.07, glide: 300 }),
    click: () => tone(2400, 0, 0.03, { type: 'square', gain: 0.03 }),
    trash: () => { noise(0, 0.35, 0.25, 900); tone(300, 0.05, 0.2, { type: 'triangle', gain: 0.1, glide: 120 }); },
    emptyTrash: () => { noise(0, 0.6, 0.3, 500); noise(0.2, 0.5, 0.2, 2000); },
    download: () => { tone(988, 0, 0.18, { gain: 0.2 }); tone(1319, 0.12, 0.35, { gain: 0.2 }); },
    screenshot: () => { noise(0, 0.08, 0.3, 3000); noise(0.12, 0.08, 0.3, 3000); },
    alert: () => (ALERTS[OS.state.alertSound] || ALERTS.Glass)(),
    error: () => ALERTS.Funk(),
    lock: () => tone(500, 0, 0.12, { type: 'triangle', gain: 0.2, glide: 250 }),
  };

  function play(name) {
    if (!vol()) return;
    if (name !== 'alert' && name !== 'error' && name !== 'startup' && OS.state.uiSounds === false) return;
    try { (SFX[name] || ALERTS[name])?.(); } catch {}
  }
  return { play, ALERTS: Object.keys(ALERTS), preview: n => { try { ALERTS[n]?.(); } catch {} } };
})();

<script>
/* js/wm.js */
// Window manager: open / drag / resize / minimize / zoom / focus
const WM = (() => {
  let z = 10, seq = 0, active = null;
  const wins = new Map();

  function open(o) {
    const id = 'w' + (++seq);
    const el = document.createElement('div');
    el.className = 'window opening' + (o.className ? ' ' + o.className : '');
    const W = Math.min(o.width || 720, innerWidth - 20);
    const H = Math.min(o.height || 460, innerHeight - 110);
    const n = wins.size % 8;
    el.style.width = W + 'px';
    el.style.height = H + 'px';
    el.style.left = (o.x ?? Math.max(8, (innerWidth - W) / 2 - 90 + n * 26)) + 'px';
    el.style.top = (o.y ?? Math.max(32, (innerHeight - H) / 2 - 70 + n * 26)) + 'px';
    el.innerHTML = `<div class="titlebar"><div class="lights"><button class="l-close" title="Close"></button><button class="l-min" title="Minimize"></button><button class="l-max" title="Zoom"></button></div><div class="title"></div><div class="tb-extra"></div></div><div class="body"></div>` +
      (o.resizable === false ? '' : '<div class="rz rz-r"></div><div class="rz rz-b"></div><div class="rz rz-br"></div>');
    document.getElementById('windows').appendChild(el);

    const win = {
      id, el, app: o.app, title: '', minimized: false, onClose: o.onClose, api: {},
      body: el.querySelector('.body'), titlebar: el.querySelector('.titlebar'), extra: el.querySelector('.tb-extra'),
      setTitle(t) { win.title = t; el.querySelector('.title').textContent = t; },
      close: () => close(win), focus: () => focus(win),
    };
    win.setTitle(o.title ?? Apps.get(o.app)?.name ?? '');
    wins.set(id, win);

    el.querySelector('.l-close').onclick = e => { e.stopPropagation(); close(win); };
    el.querySelector('.l-min').onclick = e => { e.stopPropagation(); minimize(win); };
    el.querySelector('.l-max').onclick = e => { e.stopPropagation(); toggleMax(win); };
    el.addEventListener('pointerdown', () => focus(win), true);
    win.titlebar.addEventListener('dblclick', e => { if (!e.target.closest('button,input,select')) toggleMax(win); });
    makeDrag(win);
    makeResize(win, o.minW || 260, o.minH || 150);
    focus(win);
    Sound.play('open');
    setTimeout(() => el.classList.remove('opening'), 220);
    try { o.render?.(win.body, win); } catch (e) { console.error(e); win.body.textContent = 'The app crashed: ' + e.message; }
    OS.refreshDock();
    return win;
  }

  function makeDrag(win) {
    win.titlebar.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('button,input,select,a,textarea,.no-drag')) return;
      const el = win.el;
      if (el.classList.contains('max')) return;
      const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      const mv = ev => {
        el.style.left = Math.min(innerWidth - 60, Math.max(60 - el.offsetWidth, ox + ev.clientX - sx)) + 'px';
        el.style.top = Math.min(innerHeight - 40, Math.max(25, oy + ev.clientY - sy)) + 'px';
      };
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); document.body.classList.remove('dragging'); };
      addEventListener('pointermove', mv);
      addEventListener('pointerup', up);
      document.body.classList.add('dragging');
    });
  }

  function makeResize(win, minW, minH) {
    win.el.querySelectorAll('.rz').forEach(h => h.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const el = win.el, sx = e.clientX, sy = e.clientY, ow = el.offsetWidth, oh = el.offsetHeight;
      const r = h.classList.contains('rz-r') || h.classList.contains('rz-br');
      const b = h.classList.contains('rz-b') || h.classList.contains('rz-br');
      const mv = ev => {
        if (r) el.style.width = Math.max(minW, ow + ev.clientX - sx) + 'px';
        if (b) el.style.height = Math.max(minH, oh + ev.clientY - sy) + 'px';
        win.api.onResize?.();
      };
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); document.body.classList.remove('dragging'); };
      addEventListener('pointermove', mv);
      addEventListener('pointerup', up);
      document.body.classList.add('dragging');
    }));
  }

  function focus(win) {
    if (!win || !wins.has(win.id)) return;
    if (active === win && win.el.style.zIndex == z) return;
    win.el.style.zIndex = ++z;
    wins.forEach(w => w.el.classList.toggle('inactive', w !== win));
    active = win;
    win.api.onFocus?.();
    OS.updateMenubar();
  }

  function topVisible() {
    let best = null;
    wins.forEach(w => { if (!w.minimized && (!best || +w.el.style.zIndex > +best.el.style.zIndex)) best = w; });
    return best;
  }

  function close(win) {
    if (!wins.has(win.id)) return;
    try { win.onClose?.(); } catch (e) { console.error(e); }
    wins.delete(win.id);
    Sound.play('close');
    win.el.classList.add('closing');
    setTimeout(() => win.el.remove(), 160);
    if (active === win) { active = null; const t = topVisible(); t ? focus(t) : OS.updateMenubar(); }
    OS.refreshDock();
  }

  function minimize(win) {
    win.minimized = true;
    Sound.play('minimize');
    win.el.classList.add('minimized');
    if (active === win) { active = null; const t = topVisible(); t ? focus(t) : OS.updateMenubar(); }
    OS.refreshDock();
  }

  function restore(win) {
    win.minimized = false;
    win.el.classList.remove('minimized');
    focus(win);
    OS.refreshDock();
  }

  function toggleMax(win) {
    win.el.classList.toggle('max');
    setTimeout(() => win.api.onResize?.(), 260);
  }

  return {
    open, close, focus, minimize, restore, toggleMax,
    byApp: app => [...wins.values()].filter(w => w.app === app),
    all: () => [...wins.values()],
    get active() { return active; },
    closeAll() { [...wins.values()].forEach(close); },
  };
})();

</script>

const WALLPAPERS = {

const ACCENTS = ['#0a84ff', '#bf5af2', '#ff375f', '#ff9f0a', '#ffd60a', '#30d158', '#8e8e93'];
const DOCK_PINNED = ['finder', 'launchpad', 'safari', 'notes', 'terminal', 'textedit', 'calculator', 'appstore', 'settings'];

const OS = {
  state: {
    user: 'Guest', dark: false, accent: '#0a84ff', wallpaper: 'sonoma', wallpaperPath: null, installed: [], webapps: [], brightness: 1,
    // sound
    soundOn: true, volume: 0.6, alertSound: 'Glass', uiSounds: true, startupSound: true,
    // dock
    dockSize: 48, dockMag: true, dockMagAmt: 24, dockPos: 'bottom', dockAutohide: false, dockColor: 'glass', dockCustom: '#5e5ce6', dockOpacity: 0.25,

  },
  drive: null, clip: null, loggedIn: false, dirty: false, _wpUrl: null, proxy: null, downloads: [],
};
const DOCK_COLORS = { glass: null, smoke: '30,30,32', white: '255,255,255', blue: '10,132,255', purple: '191,90,242', pink: '255,55,95', green: '48,209,88', orange: '255,159,10', red: '255,59,48' };
const SEARCH_ENGINES = {

  google: ['Google', 'https://www.google.com/search?q='],

};
// Is the built-in web proxy available? (only when started with serve.js)
fetch('/proxy-info').then(r => r.ok ? r.json() : null).then(j => { OS.proxy = j?.proxy || null; }).catch(() => {});

/* ---------- boot & login ---------- */
OS.boot = function () {
  applyTheme();
  const bar = $('#boot .progress i');
  let p = 0;
  const t = setInterval(() => {
    p += 5 + Math.random() * 12;
    bar.style.width = Math.min(p, 100) + '%';
    if (p >= 100) { clearInterval(t); setTimeout(showLogin, 350); }
  }, 90);
};

function showLogin(lock = false) {
  $('#boot').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#desktop').classList.add('lowered');
  const name = $('#login-name');
  name.disabled = lock;
  if (lock) name.value = OS.state.user;
  $('#login-go').focus();
  if (!lock) name.select();
  const tick = () => {
    const d = new Date();
    $('.lc-date').textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    $('.lc-time').textContent = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  };
  tick();
  clearInterval(OS._lc); OS._lc = setInterval(tick, 1000);
}

function doLogin() {
  if (!OS.loggedIn) {
    OS.state.user = $('#login-name').value.trim() || 'Guest';
    VFS.init(OS.state.user);
    Apps.sync();
    OS.loggedIn = true;
    if (OS.state.startupSound) Sound.play('startup');
    startDesktop();
    setTimeout(() => OS.toast('Temporary mode', 'Nothing is saved unless you connect a drive. Click ⚠ in the menu bar or "Connect Drive" in Finder.', '💾', 8000), 900);
  }
  clearInterval(OS._lc);
  $('#login').classList.add('hidden');
  $('#desktop').classList.remove('hidden', 'lowered');
}
$('#login-go').onclick = doLogin;
$('#login-name').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
$('#login').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id !== 'login-name') doLogin(); });
$$('#login .login-power button').forEach(b => b.onclick = () => b.dataset.act === 'restart' ? OS.restart(true) : OS.shutdown(true));

function startDesktop() {
  $('#desktop').classList.remove('hidden');
  buildMenubar();
  OS.refreshDock();
  renderDesktop();
  setupDock();
  VFS.onChange(p => {
    if (!p.startsWith('/Volumes/') && !p.startsWith('/Applications')) OS.dirty = true;
    clearTimeout(OS._dt); OS._dt = setTimeout(() => { renderDesktop(); OS.refreshDock(); }, 80);
  });
  $('#desktop').addEventListener('contextmenu', e => {
    if (e.target.closest('.window,#dock-wrap,#menubar,.d-icon')) return;
    e.preventDefault();
    const D = VFS.home + '/Desktop';
    OS.menu([
      { label: 'New Folder', action: async () => VFS.mkdir(await VFS.uniquePath(D, 'untitled folder')) },
      { label: 'New Text File', action: async () => { const p = await VFS.uniquePath(D, 'untitled.txt'); await VFS.write(p, ''); OS.openFile(p); } },
      '-',
      { label: 'Open Terminal Here', action: () => Apps.launch('terminal', D) },
      { label: 'Change Wallpaper…', action: () => Apps.launch('settings', 'wallpaper') },
      { label: 'Connect Drive…', action: () => OS.connectDrive() },
    ], e.clientX, e.clientY);
  });
  $('#desktop').addEventListener('pointerdown', e => {
    if (!e.target.closest('.d-icon')) $$('.d-icon.sel').forEach(x => x.classList.remove('sel'));
  });
}

window.addEventListener('beforeunload', e => {
  if (OS.dirty && !OS._leaving) { e.preventDefault(); e.returnValue = ''; }
});

OS.restart = async function (skipAsk) {
  if (!skipAsk && !(await OS.confirm('Restart your Mac?', 'All files that are not on a connected drive will be erased.', 'Restart'))) return;
  OS._leaving = true;
  $('#shade').className = 'black';
  setTimeout(() => location.reload(), 500);
};
OS.shutdown = async function (skipAsk) {
  if (!skipAsk && !(await OS.confirm('Shut down your Mac?', 'All files that are not on a connected drive will be erased.', 'Shut Down'))) return;
  OS._leaving = true;
  WM.closeAll();
  const s = $('#shade');
  s.className = 'black';
  s.innerHTML = '<button class="power-btn" title="Power on">⏻</button><p>Click to start up</p>';
  s.querySelector('.power-btn').onclick = () => location.reload();
};
OS.sleep = function () {
  const s = $('#shade');
  s.className = 'black sleep';
  s.innerHTML = '';
  setTimeout(() => s.onclick = () => { s.className = 'hidden'; s.onclick = null; showLogin(true); }, 300);
};
OS.lock = () => { Sound.play('lock'); showLogin(true); };

/* ---------- theme ---------- */
function applyTheme() {
  const s = OS.state;
  document.body.classList.toggle('dark', !!s.dark);
  document.documentElement.style.setProperty('--accent', s.accent);
  const bg = s.wallpaper === 'custom' && OS._wpUrl ? `url("${OS._wpUrl}") center/cover no-repeat` : (WALLPAPERS[s.wallpaper] || WALLPAPERS.sonoma);
  $('#wall').style.background = bg;
  $('#dim').style.opacity = String(1 - (s.brightness ?? 1));
  document.body.classList.toggle('solid', !!s.reduceTransparency);
  applyDock();
  dock.addEventListener('contextmenu', e => {
    if (e.target.closest('.dock-item')) return;
    e.preventDefault();
    const st = OS.state, pos = p => () => OS.set({ dockPos: p });
    OS.menu([
      { label: 'Turn Hiding ' + (st.dockAutohide ? 'Off' : 'On'), action: () => OS.set({ dockAutohide: !st.dockAutohide }) },
      { label: 'Turn Magnification ' + (st.dockMag ? 'Off' : 'On'), action: () => OS.set({ dockMag: !st.dockMag }) },
      '-',
      { label: 'Position: Left', checked: st.dockPos === 'left', action: pos('left') },
      { label: 'Position: Bottom', checked: st.dockPos === 'bottom', action: pos('bottom') },
      { label: 'Position: Right', checked: st.dockPos === 'right', action: pos('right') },
      '-',
      { label: 'Dock Settings…', action: () => Apps.launch('settings', 'dock') },
    ], e.clientX, e.clientY);
  });
}
function applyDock() {
  const s = OS.state, wrap = $('#dock-wrap');
  if (!wrap) return;
  const rgb = s.dockColor === 'custom' ? hexRgb(s.dockCustom) : DOCK_COLORS[s.dockColor] || (s.dark ? '30,30,32' : '255,255,255');
  const root = document.documentElement.style;
  root.setProperty('--dock-bg', `rgba(${rgb},${s.dockOpacity ?? 0.25})`);
  root.setProperty('--dock-size', (s.dockSize || 48) + 'px');
  wrap.className = `pos-${s.dockPos || 'bottom'}${s.dockAutohide ? ' autohide' : ''}`;
  $$('#dock .icon').forEach(ic => sizeIcon(ic, s.dockSize || 48));
  document.body.dataset.dock = s.dockPos || 'bottom';
}
const hexRgb = h => { const n = parseInt((h || '#000000').slice(1), 16); return `${n >> 16},${(n >> 8) & 255},${n & 255}`; };
const sizeIcon = (ic, s) => { ic.style.width = ic.style.height = s + 'px'; ic.style.fontSize = s * 0.55 + 'px'; };
OS.applyTheme = applyTheme;
OS.set = function (patch) { Object.assign(OS.state, patch); applyTheme(); OS.saveState(); OS.refreshSettings?.(); };
OS.setWallpaperFile = async function (path) {
  try {
    const blob = await VFS.readBlob(path);
    if (OS._wpUrl) URL.revokeObjectURL(OS._wpUrl);
    OS._wpUrl = URL.createObjectURL(blob);
    OS.set({ wallpaper: 'custom', wallpaperPath: VFS.norm(path) });
    if (!VFS.isPersistent(path)) OS.toast('Wallpaper set', 'This image is temporary. Put it on your drive to keep it after restart.', '🖼️');
  } catch (e) { OS.toast('Could not set wallpaper', e.message, '⚠️'); }
};

/* ---------- drive (persistent storage) ---------- */
OS.connectDrive = async function () {
  if (!window.showDirectoryPicker) {
    OS.alert('Drive not supported', 'Your browser cannot connect real folders. Please open this simulator in Google Chrome or Microsoft Edge.');
    return null;
  }
  try {
    const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'macsim-drive' });
    if (h.requestPermission && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('Write permission was denied');
    const path = VFS.mount(h.name, h);
    if (!OS.drive) OS.drive = path;
    OS.toast('Drive connected', `"${h.name}" is mounted at ${path}. Files saved there are written to your real disk.`, '💽');
    await loadStateFromDrive();
    updateDriveIndicator();
    OS.refreshSettings?.();
    return path;
  } catch (e) {
    if (e.name !== 'AbortError') OS.toast('Could not connect drive', e.message, '⚠️');
    return null;
  }
};
OS.ejectDrive = function (name) {
  VFS.unmount(name);
  if (OS.drive === '/Volumes/' + name) OS.drive = VFS.mounts()[0]?.path || null;
  OS.toast('Drive ejected', `"${name}" can be safely removed.`, '⏏️');
  updateDriveIndicator();
  OS.refreshSettings?.();
};
OS.saveState = async function () {
  if (!OS.drive) return;
  try {
    await VFS.mkdir(OS.drive + '/.macsim');
    await VFS.write(OS.drive + '/.macsim/state.json', JSON.stringify(OS.state, null, 2));
  } catch (e) { console.warn('saveState', e); }
};
async function loadStateFromDrive() {
  try {
    const saved = JSON.parse(await VFS.read(OS.drive + '/.macsim/state.json'));
    const { user, ...rest } = saved;
    Object.assign(OS.state, rest);
    Apps.sync();
    if (OS.state.wallpaper === 'custom' && OS.state.wallpaperPath) await OS.setWallpaperFile(OS.state.wallpaperPath);
    applyTheme();
    OS.refreshDock();
    OS.toast('Welcome back', `Restored your settings and ${OS.state.installed.length + OS.state.webapps.length} installed app(s) from the drive.`, '✨');
  } catch {
    OS.saveState(); // first time: write current setup to the drive
  }
}

/* ---------- dialogs & notifications ---------- */
OS.toast = function (title, body = '', icon = '🔔', ms = 5000, onClick) {
  const t = el(`<div class="toast"><div class="t-icon">${icon}</div><div class="t-text"><b>${esc(title)}</b><p>${esc(body)}</p></div></div>`);
  $('#toasts').appendChild(t);
  Sound.play(icon === '⚠️' ? 'error' : 'alert');
  t.onclick = () => { t.remove(); onClick?.(); };
  setTimeout(() => t.classList.add('out'), ms);
  setTimeout(() => t.remove(), ms + 400);
};

function modal(html, setup) {
  return new Promise(res => {
    const ov = el(`<div class="modal-ov"><div class="modal">${html}</div></div>`);
    document.body.appendChild(ov);
    Sound.play('alert');
    const done = v => { ov.remove(); res(v); };
    setup(ov, done);
  });
}
OS.prompt = (title, value = '', msg = '') => modal(

  (ov, done) => {

OS.confirm = (title, msg = '', ok = 'OK') => modal(

// Save dialog: pick a location + file name. Warns when the location is temporary.
OS.saveDialog = function (name = 'Untitled.txt', dir) {
  const H = VFS.home;
  const locs = [...VFS.mounts().map(m => [m.path, '💽 ' + m.name + ' (drive – permanent)']),
    [H + '/Documents', '📄 Documents'], [H + '/Desktop', '🖥 Desktop'], [H + '/Downloads', '⬇️ Downloads'], [H + '/Pictures', '🖼 Pictures'], [H, '🏠 Home']];
  if (dir && !locs.some(l => l[0] === dir)) locs.unshift([dir, '📁 ' + VFS.basename(dir)]);
  const def = dir || OS.drive || H + '/Documents';
  return modal(
    `<div class="m-title">Save As</div><input class="m-input" spellcheck="false"><label class="m-row">Where: <select class="m-sel">${locs.map(([p, l]) => `<option value="${esc(p)}"${p === def ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label><div class="m-warn"></div>
     <div class="m-btns"><button class="btn link" data-v="c">Connect Drive…</button><span style="flex:1"></span><button class="btn" data-v="0">Cancel</button><button class="btn primary" data-v="1">Save</button></div>`,
    (ov, done) => {
      const inp = $('.m-input', ov), sel = $('.m-sel', ov), warn = $('.m-warn', ov);
      inp.value = name;
      const upd = () => {
        const perm = VFS.isPersistent(sel.value);
        warn.className = 'm-warn ' + (perm ? 'ok' : 'bad');
        warn.textContent = perm ? '💾 Saved to your real drive — kept after restart.' : '⚠ Temporary — this location is erased when the Mac restarts.';
      };
      upd(); sel.onchange = upd;
      inp.focus();
      const dot = name.lastIndexOf('.'); inp.setSelectionRange(0, dot > 0 ? dot : name.length);
      const finish = () => inp.value.trim() && done(VFS.join(sel.value, inp.value.trim()));
      ov.onclick = async e => {
        const b = e.target.closest('[data-v]'); if (!b) return;
        if (b.dataset.v === 'c') {
          const p = await OS.connectDrive();
          if (p) { sel.insertAdjacentHTML('afterbegin', `<option value="${esc(p)}">💽 ${esc(VFS.basename(p))} (drive – permanent)</option>`); sel.value = p; upd(); }
        } else if (b.dataset.v === '1') finish(); else done(null);
      };
      inp.onkeydown = e => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') done(null); };
    });
};

/* ---------- menus ---------- */
OS.menu = function (items, x, y, opts = {}) {
  closeMenus();
  const m = el(`<div class="menu${opts.cls ? ' ' + opts.cls : ''}"></div>`);
  for (const it of items) {
    if (!it) continue;
    if (it === '-') { m.appendChild(el('<div class="menu-sep"></div>')); continue; }
    const r = el(`<div class="menu-item${it.disabled ? ' disabled' : ''}${it.checked ? ' checked' : ''}"><span>${esc(it.label)}</span><span class="sc">${esc(it.sc || '')}</span></div>`);
    r.onclick = e => { e.stopPropagation(); if (it.disabled) return; closeMenus(); it.action?.(); };
    m.appendChild(r);
  }
  m.addEventListener('mousedown', e => e.preventDefault());
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + 'px';
  m.style.top = Math.max(26, Math.min(y, innerHeight - r.height - 4)) + 'px';
  OS._menu = m;
  m._owner = opts.owner;
  opts.owner?.classList.add('open');

};
