/* ---------- dock ---------- */
OS.refreshDock = function () {
  const dock = $('#dock');
  if (!dock || !OS.loggedIn) return;
  const ids = [...DOCK_PINNED];
  for (const a of Apps.installed()) if (!a.builtin && !ids.includes(a.id)) ids.push(a.id);
  for (const w of WM.all()) if (!ids.includes(w.app)) ids.push(w.app);
  dock.innerHTML = '';
  for (const id of ids) {
    const a = Apps.get(id);
    if (!a) continue;
    const running = WM.byApp(id).length > 0;
    const it = el(`<div class="dock-item" data-app="${id}"><div class="dock-label">${esc(a.name)}</div>${Apps.icon(id, OS.state.dockSize || 48)}<i class="dot${running ? ' on' : ''}"></i></div>`);
    it.onclick = () => dockClick(id, it);
    it.oncontextmenu = e => {
      e.preventDefault();
      const ws = WM.byApp(id);
      OS.menu([
        ...ws.map(w => ({ label: w.title || a.name, action: () => WM.restore(w) })),
        ws.length ? '-' : null,
        { label: ws.length ? 'New Window' : 'Open', action: () => Apps.launch(id) },
        ws.length ? { label: 'Quit', action: () => ws.forEach(w => w.close()) } : null,
        a.store || a.web ? '-' : null,
        a.store || a.web ? { label: 'Uninstall', action: () => Apps.uninstall(id) } : null,
      ], e.clientX, e.clientY - 10);
    };
    dock.appendChild(it);
  }
  dock.appendChild(el('<div class="dock-sep"></div>'));
  for (const w of WM.all().filter(w => w.minimized)) {
    const it = el(`<div class="dock-item mini"><div class="dock-label">${esc(w.title || Apps.get(w.app)?.name)}</div>${Apps.icon(w.app, OS.state.dockSize || 48)}</div>`);
    it.onclick = () => WM.restore(w);
    dock.appendChild(it);
  }
  const S = OS.state.dockSize || 48;
  const busy = OS.downloads.some(d => !d.done && !d.error);
  const dl = el(`<div class="dock-item"><div class="dock-label">Downloads</div><div class="icon dl-icon" style="width:${S}px;height:${S}px;font-size:${S * .55}px">${busy ? '⏳' : '⬇️'}</div></div>`);
  dl.onclick = e => { const r = dl.getBoundingClientRect(); OS.downloadsMenu(r.left, r.top - 10); };
  dock.appendChild(dl);
  const tr = el(`<div class="dock-item"><div class="dock-label">Trash</div><div class="icon trash-icon" style="width:${S}px;height:${S}px;font-size:${S * .55}px">🗑️</div></div>`);
  tr.onclick = () => Apps.launch('finder', VFS.home + '/.Trash');
  tr.oncontextmenu = e => { e.preventDefault(); OS.menu([{ label: 'Open', action: () => tr.onclick() }, { label: 'Empty Trash', action: OS.emptyTrash }], e.clientX, e.clientY - 10); };
  dock.appendChild(tr);
};
function dockClick(id, it) {
  Sound.play('click');
  const ws = WM.byApp(id);
  if (!ws.length) {
    it.classList.add('bounce');
    setTimeout(() => it.classList.remove('bounce'), 700);
    Apps.launch(id);
    return;
  }
  const mins = ws.filter(w => w.minimized);
  if (mins.length === ws.length) WM.restore(mins[mins.length - 1]);
  else ws.filter(w => !w.minimized).forEach(w => WM.focus(w));
}
function setupDock() {
  const dock = $('#dock');
  dock.addEventListener('mousemove', e => {
    const st = OS.state, base = st.dockSize || 48;
    if (!st.dockMag) return;
    const side = st.dockPos === 'left' || st.dockPos === 'right';
    $$('.dock-item .icon', dock).forEach(ic => {
      const r = ic.parentElement.getBoundingClientRect();
      const d = side ? Math.abs(e.clientY - (r.top + r.height / 2)) : Math.abs(e.clientX - (r.left + r.width / 2));
      sizeIcon(ic, base + (st.dockMagAmt ?? 24) * Math.max(0, 1 - d / (base * 2.5)));
    });
  });
  dock.addEventListener('mouseleave', () => $$('.dock-item .icon', dock).forEach(ic => sizeIcon(ic, OS.state.dockSize || 48)));
  // auto-hide: reveal when the mouse touches the screen edge
  const hot = $('#dock-hot');
  hot.addEventListener('mouseenter', () => $('#dock-wrap').classList.add('reveal'));
  $('#dock-wrap').addEventListener('mouseleave', () => $('#dock-wrap').classList.remove('reveal'));
  applyDock();
}
OS.emptyTrash = async function () {
  const tr = VFS.home + '/.Trash';
  const items = await VFS.list(tr).catch(() => []);
  if (!items.length) return OS.toast('Trash is empty', '', '🗑️');
  if (!(await OS.confirm('Empty the Trash?', `${items.length} item(s) will be erased immediately.`, 'Empty Trash'))) return;
  for (const i of items) await VFS.rm(i.path);
  Sound.play('emptyTrash');

/* ---------- downloads ---------- */
OS.downloadsDir = () => (OS.drive ? OS.drive : VFS.home) + '/Downloads';
// Download any web address into the Mac's Downloads folder (on the drive when one is connected)
OS.downloadUrl = async function (url, name = '') {
  const item = { url, name: name || decodeURIComponent(new URL(url).pathname.split('/').pop() || '') || 'download', progress: 0, done: false, error: null };
  OS.downloads.unshift(item);
  OS.refreshDock();
  try {
    const src = OS.proxy ? `${OS.proxy}/proxy?raw=1&url=${encodeURIComponent(url)}` : url;
    const r = await fetch(src);
    if (!r.ok) throw new Error(`Server answered ${r.status}`);
    const cd = r.headers.get('content-disposition') || '';
    const m = cd.match(/filename\*?=(?:UTF-8'')?["']?([^"';]+)/i);
    if (m && !name) item.name = decodeURIComponent(m[1]);
    if (!/\.[a-z0-9]{1,5}$/i.test(item.name)) {
      const ext = { 'text/html': 'html', 'application/pdf': 'pdf', 'image/png': 'png', 'image/jpeg': 'jpg', 'application/zip': 'zip', 'text/plain': 'txt', 'image/svg+xml': 'svg', 'audio/mpeg': 'mp3', 'video/mp4': 'mp4' }[(r.headers.get('content-type') || '').split(';')[0]];
      if (ext) item.name += '.' + ext;
    }
    item.name = item.name.replace(/[\\/:*?"<>|]/g, '_');
    const total = +r.headers.get('content-length') || 0, reader = r.body.getReader(), chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      item.progress = total ? got / total : 0; item.size = got;
      OS.onDownloadProgress?.();
    }
    const dir = OS.downloadsDir();
    await VFS.mkdir(dir);
    item.path = await VFS.uniquePath(dir, item.name);
    await VFS.write(item.path, new Blob(chunks, { type: r.headers.get('content-type') || '' }));
    item.done = true; item.progress = 1;
    Sound.play('download');
    OS.toast('Download complete', `${VFS.basename(item.path)} · ${fmtSize(got)} → ${VFS.isPersistent(item.path) ? 'drive' : 'Downloads (temporary)'}`, '⬇️', 5000, () => OS.open(item.path));
  } catch (e) {
    item.error = OS.proxy ? e.message : 'This site blocks direct downloads. Start the Mac with “Start Mac.bat” to enable downloading from any site.';
    OS.toast('Download failed', item.error, '⚠️');
  }
  OS.onDownloadProgress?.();
  OS.refreshDock();
};
OS.downloadsMenu = function (x, y) {
  const list = OS.downloads.slice(0, 12);
  OS.menu([
    { label: list.length ? 'Recent downloads' : 'No downloads yet', disabled: true },
    ...list.map(d => ({ label: `${d.error ? '⚠ ' : d.done ? '✓ ' : '… '}${d.path ? VFS.basename(d.path) : d.name}${d.size ? '  (' + fmtSize(d.size) + ')' : ''}`, disabled: !d.done, action: () => OS.open(d.path) })),
    '-',
    { label: 'Download from a link…', action: async () => { const u = await OS.prompt('Download file', 'https://', 'Paste the address of any file'); if (u && /^https?:\/\/./.test(u)) OS.downloadUrl(u.trim()); } },
    { label: 'Open Downloads Folder', action: async () => { await VFS.mkdir(OS.downloadsDir()); Apps.launch('finder', OS.downloadsDir()); } },
  ], x, y);
};

/* ---------- file icons & actions ---------- */
const EXT = {
  img: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico', 'avif'],
  audio: ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'],
  video: ['mp4', 'webm', 'mov', 'mkv'],
  code: ['js', 'ts', 'html', 'htm', 'css', 'json', 'py', 'java', 'c', 'cpp', 'cs', 'go', 'rs', 'php', 'rb', 'sh', 'xml', 'yml', 'yaml', 'jsx', 'tsx'],
};
function fileIcon(it, s = 56) {
  if (it.type === 'app') return Apps.icon(it.app, s * 0.9);
  if (it.mount) return `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="6" y="20" width="52" height="28" rx="5" fill="#e3e3e8" stroke="#9a9aa0" stroke-width="1.5"/><rect x="6" y="38" width="52" height="10" rx="3" fill="#c7c7cc"/><circle cx="50" cy="43" r="2.2" fill="#34c759"/><rect x="12" y="41" width="20" height="3" rx="1.5" fill="#8e8e93"/></svg>`;
  if (it.type === 'dir') {
    const g = { Desktop: '▭', Documents: '▤', Downloads: '↓', Pictures: '◐', Music: '♪', Movies: '▶', Applications: 'A', '.Trash': '🗑', Notes: '✎' }[it.name] || '';
    return `<svg width="${s}" height="${s}" viewBox="0 0 64 56"><path d="M4 10a4 4 0 0 1 4-4h17l6 6h25a4 4 0 0 1 4 4v6H4z" fill="#2f8ff0"/><rect x="4" y="15" width="56" height="37" rx="4" fill="#5cb2ff"/><text x="32" y="42" font-size="18" text-anchor="middle" fill="#2a7ad6" font-family="system-ui,sans-serif" font-weight="700">${esc(g)}</text></svg>`;
  }
  const x = VFS.ext(it.name);
  const color = EXT.img.includes(x) ? '#ff9f0a' : EXT.audio.includes(x) ? '#ff375f' : EXT.video.includes(x) ? '#5e5ce6' : EXT.code.includes(x) ? '#0a84ff' : x === 'pdf' ? '#ff3b30' : '#8e8e93';
  return `<svg width="${s}" height="${s}" viewBox="0 0 56 64"><path d="M8 2h28l14 14v44a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#fff" stroke="#c7c7cc"/><path d="M36 2v14h14" fill="#ececf0" stroke="#c7c7cc"/>${x ? `<rect x="10" y="40" width="34" height="13" rx="3" fill="${color}"/><text x="27" y="50" font-size="9" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="700">${esc(x.toUpperCase().slice(0, 4))}</text>` : '<path d="M14 22h28M14 28h28M14 34h20" stroke="#d1d1d6" stroke-width="2"/>'}</svg>`;
}
OS.fileIcon = fileIcon;

function fileApp(path) {
  const x = VFS.ext(path);
  if (EXT.img.includes(x) || x === 'pdf') return 'preview';
  if (EXT.audio.includes(x) || EXT.video.includes(x)) return 'quicktime';
  if (x === 'md' && Apps.isInstalled('markdown')) return 'markdown';
  if (['db', 'sqlite', 'sqlite3'].includes(x) && Apps.isInstalled('sqlite')) return 'sqlite';
  if ((EXT.code.includes(x) || Runner.canRun(x)) && Apps.isInstalled('code')) return 'code';
  return 'textedit';
}
OS.open = async function (it) {
  if (typeof it === 'string') {
    const s = await VFS.stat(it);
    if (!s) return OS.toast('Not found', it, '⚠️');
    it = { ...s, path: VFS.norm(it), name: VFS.basename(it) };
  }
  if (it.type === 'app') return Apps.launch(it.app);
  if (it.type === 'dir') return Apps.launch('finder', it.path);
  OS.openFile(it.path);
};
OS.openFile = (path, appId) => Apps.launch(appId || fileApp(path), VFS.norm(path));

OS.trash = async function (path) {
  path = VFS.norm(path);
  if (VFS.isPersistent(path)) {
    if (await OS.confirm('Delete from drive?', `“${VFS.basename(path)}” will be permanently deleted from your real folder. This can’t be undone.`, 'Delete')) await VFS.rm(path);
    return;
  }
  const tr = VFS.home + '/.Trash';
  if (path.startsWith(tr + '/')) {
    if (await OS.confirm('Delete immediately?', `“${VFS.basename(path)}” will be erased.`, 'Delete')) await VFS.rm(path);
    return;
  }
  await VFS.move(path, await VFS.uniquePath(tr, VFS.basename(path)));
  Sound.play('trash');
};
OS.download = async function (path) {
  const blob = await VFS.readBlob(path);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = VFS.basename(path);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
OS.importFiles = function (dir) {
  const inp = el('<input type="file" multiple hidden>');
  document.body.appendChild(inp);
  inp.onchange = async () => {
    for (const f of inp.files) await VFS.write(await VFS.uniquePath(dir, f.name), f);
    OS.toast('Imported', `${inp.files.length} file(s) copied into ${VFS.basename(dir)}`, '⬆️');
    inp.remove();
  };
  inp.click();
};
OS.getInfo = async function (path) {
  path = VFS.norm(path);
  const s = await VFS.stat(path);
  if (!s) return;
  let size = s.size;
  if (s.type === 'dir') { try { size = (await VFS.list(path)).length; } catch {} }
  const it = { ...s, name: VFS.basename(path), path };
  WM.open({
    app: 'finder', title: `${it.name} Info`, width: 300, height: 380, resizable: false, className: 'info-win',
    render(b) {
      b.innerHTML = `<div class="info"><div class="info-ic">${fileIcon(it, 72)}</div><h3>${esc(it.name)}</h3>
      <dl><dt>Kind</dt><dd>${it.mount ? 'Drive (real folder)' : s.type === 'dir' ? 'Folder' : s.type === 'app' ? 'Application' : (VFS.ext(path).toUpperCase() || 'Plain') + ' document'}</dd>
      <dt>${s.type === 'dir' ? 'Items' : 'Size'}</dt><dd>${s.type === 'dir' ? size + ' items' : fmtSize(size || 0)}</dd>
      <dt>Where</dt><dd>${esc(VFS.dirname(path))}</dd>
      <dt>Modified</dt><dd>${fmtDate(s.mtime)}</dd>
      <dt>Storage</dt><dd>${VFS.isPersistent(path) ? '<span class="ok">💾 Real drive (permanent)</span>' : '<span class="warn">⚠ Memory (erased on restart)</span>'}</dd></dl></div>`;
    },
  });
};

// Context menu for a file/folder/app (used by Finder and the Desktop)
OS.itemMenu = function (it, x, y) {
  const isFile = it.type === 'file', x2 = VFS.ext(it.name);
  const a = it.type === 'app' ? Apps.get(it.app) : null;
  if (a) {
    return OS.menu([
      { label: 'Open', action: () => Apps.launch(a.id) },
      { label: 'Get Info', action: () => OS.getInfo(it.path) },
      '-',
      { label: a.builtin ? 'System app (can’t uninstall)' : 'Uninstall', disabled: !!a.builtin, action: () => Apps.uninstall(a.id) },
    ], x, y);
  }
  if (it.mount) {
    return OS.menu([
      { label: 'Open', action: () => OS.open(it) },
      { label: 'Open in Terminal', action: () => Apps.launch('terminal', it.path) },
      { label: 'Get Info', action: () => OS.getInfo(it.path) },
      '-',
      { label: `Eject “${it.name}”`, action: () => OS.ejectDrive(it.name) },
    ], x, y);
  }
  const drives = VFS.mounts();
  return OS.menu([
    { label: 'Open', action: () => OS.open(it) },
    isFile ? { label: 'Open with TextEdit', action: () => OS.openFile(it.path, 'textedit') } : null,
    isFile && Apps.isInstalled('code') ? { label: 'Open with Code Studio', action: () => OS.openFile(it.path, 'code') } : null,
    isFile && ['html', 'htm', 'svg', 'pdf'].includes(x2) ? { label: 'Open in Safari', action: () => Apps.launch('safari', it.path) } : null,
    isFile && EXT.img.includes(x2) ? { label: 'Set Desktop Picture', action: () => OS.setWallpaperFile(it.path) } : null,
    it.type === 'dir' ? { label: 'Open in Terminal', action: () => Apps.launch('terminal', it.path) } : null,
    '-',
    { label: 'Get Info', action: () => OS.getInfo(it.path) },
    { label: 'Rename…', action: async () => { const n = await OS.prompt('Rename', it.name); if (n && n !== it.name) { if (n.includes('/')) return OS.toast('Invalid name', 'Names can’t contain “/”', '⚠️'); try { await VFS.move(it.path, VFS.join(VFS.dirname(it.path), n)); } catch (e) { OS.toast('Rename failed', e.message, '⚠️'); } } } },
    { label: 'Duplicate', action: async () => VFS.copy(it.path, await VFS.uniquePath(VFS.dirname(it.path), it.name.replace(/(\.[^.]+)?$/, ' copy$1'))) },
    { label: 'Copy', action: () => { OS.clip = it.path; OS.toast('Copied', it.name, '📋', 1800); } },
    ...drives.filter(d => !it.path.startsWith(d.path + '/')).map(d => ({ label: `Copy to “${d.name}” (save permanently)`, action: async () => { await VFS.copy(it.path, await VFS.uniquePath(d.path, it.name)); OS.toast('Saved to drive', `${it.name} → ${d.name}`, '💾'); } })),
    isFile ? { label: 'Download to this computer', action: () => OS.download(it.path) } : null,
    '-',
    { label: VFS.isPersistent(it.path) ? 'Delete from Drive…' : 'Move to Trash', action: () => OS.trash(it.path) },
  ], x, y);
};

/* ---------- desktop icons ---------- */
async function renderDesktop() {
  const c = $('#desktop-icons');
  const items = VFS.mounts().map(m => ({ name: m.name, path: m.path, type: 'dir', mount: true }));
  try { items.push(...(await VFS.list(VFS.home + '/Desktop')).filter(i => !i.name.startsWith('.'))); } catch {}
  c.innerHTML = '';
  for (const it of items) {
    const d = el(`<div class="d-icon">${fileIcon(it, 54)}<span>${esc(it.name)}</span></div>`);
    d.onclick = () => { $$('.d-icon.sel').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); };
    d.ondblclick = () => OS.open(it);
    d.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); d.onclick(); OS.itemMenu(it, e.clientX, e.clientY); };
    c.appendChild(d);
  }
}

/* ---------- Launchpad ---------- */
function toggleLaunchpad() {
  const lp = $('#launchpad');
  if (!lp.classList.contains('hidden')) return closeLaunchpad();
  closeSpotlight();
  lp.innerHTML = `<input class="lp-search" placeholder="Search"><div class="lp-grid"></div>`;
  const grid = $('.lp-grid', lp), inp = $('.lp-search', lp);
  const draw = () => {
    const q = inp.value.toLowerCase();
    grid.innerHTML = '';
    for (const a of Apps.installed().filter(a => a.id !== 'launchpad' && a.name.toLowerCase().includes(q))) {
      const it = el(`<div class="lp-item">${Apps.icon(a.id, 76)}<span>${esc(a.name)}</span></div>`);
      it.onclick = e => { e.stopPropagation(); closeLaunchpad(); Apps.launch(a.id); };
      grid.appendChild(it);
    }
  };
  draw();
  inp.oninput = draw;
  inp.onkeydown = e => { if (e.key === 'Enter') $('.lp-item', grid)?.click(); };
  lp.onclick = e => { if (!e.target.closest('.lp-item,.lp-search')) closeLaunchpad(); };
  lp.classList.remove('hidden');
  requestAnimationFrame(() => lp.classList.add('show'));
  inp.focus();
}
function closeLaunchpad() { const lp = $('#launchpad'); lp.classList.remove('show'); setTimeout(() => lp.classList.add('hidden'), 180); }
OS.toggleLaunchpad = toggleLaunchpad;

/* ---------- Spotlight ---------- */
function toggleSpotlight() {
  const sp = $('#spotlight');
  if (!sp.classList.contains('hidden')) return closeSpotlight();
  sp.classList.remove('hidden');
  const inp = $('input', sp), res = $('.sp-res', sp);
  inp.value = ''; res.innerHTML = '';
  inp.focus();
  let results = [], sel = 0;
  const draw = () => {
    res.innerHTML = results.map((r, i) => `<div class="sp-item${i === sel ? ' sel' : ''}" data-i="${i}">${r.icon}<div><b>${esc(r.title)}</b><small>${esc(r.sub || '')}</small></div></div>`).join('');
    res.classList.toggle('hidden', !results.length);
  };
  inp.oninput = () => {
    const q = inp.value.trim();
    results = [];
    if (q) {
      if (/^[\d\s+\-*/().%^]+$/.test(q) && /\d/.test(q)) {
        try { const v = Function(`"use strict";return (${q.replace(/\^/g, '**')})`)(); if (typeof v === 'number' && isFinite(v)) results.push({ icon: Apps.icon('calculator', 28), title: `= ${+v.toPrecision(12)}`, sub: 'Calculator', run: () => navigator.clipboard?.writeText(String(v)) }); } catch {}
      }
      for (const a of Apps.installed().filter(a => a.name.toLowerCase().includes(q.toLowerCase()))) results.push({ icon: Apps.icon(a.id, 28), title: a.name, sub: 'Application', run: () => Apps.launch(a.id) });
      for (const a of Apps.all().filter(a => a.store && !Apps.isInstalled(a.id) && a.name.toLowerCase().includes(q.toLowerCase()))) results.push({ icon: Apps.icon(a.id, 28), title: a.name, sub: 'Get it on the App Store', run: () => Apps.launch('appstore', a.id) });
      for (const f of VFS.search(q, 12)) results.push({ icon: fileIcon(f, 28), title: f.name, sub: f.path, run: () => OS.open(f) });
      results.push({ icon: Apps.icon('safari', 28), title: `Search the web for “${q}”`, sub: 'Safari', run: () => Apps.launch('safari', q) });
    }
    sel = 0; draw();
  };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown') { sel = Math.min(results.length - 1, sel + 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    if (e.key === 'Enter' && results[sel]) { closeSpotlight(); results[sel].run(); }
    if (e.key === 'Escape') closeSpotlight();
  };
  res.onclick = e => { const it = e.target.closest('.sp-item'); if (it) { closeSpotlight(); results[+it.dataset.i].run(); } };
  sp.onclick = e => { if (e.target === sp) closeSpotlight(); };
}
function closeSpotlight() { $('#spotlight').classList.add('hidden'); }

/* js/runner.js */
// Code runner: Python (real CPython via Pyodide, runs in your browser), JavaScript (in a sandboxed worker),
// and 25+ compiled languages (C, C++, Java, Go, Rust, …) via the free Wandbox online compiler.
const Runner = (() => {

    rs: ['Rust', 'Rust'], rb: ['Ruby', 'Ruby'], php: ['PHP', 'PHP'], cs: ['C#', 'C#'], ts: ['TypeScript', 'TypeScript'],

    d: ['D', 'D'], pas: ['Pascal', 'Pascal'], ml: ['OCaml', 'OCaml'], lisp: ['Lisp', 'Lisp'], groovy: ['Groovy', 'Groovy'], cr: ['Crystal', 'Crystal'],

    cpp: '#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> v{1, 2, 3, 4, 5};\n    int sum = 0;\n    for (int x : v) sum += x;\n    std::cout << "Hello from C++! Sum = " << sum << std::endl;\n}\n',

    go: 'package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("Hello from Go!")\n}\n',

    rb: 'puts "Hello from Ruby!"\nputs (1..5).map { |x| x * x }.inspect\n',
    php: '<?php\necho "Hello from PHP!\\n";\nprint_r(array_map(fn($x) => $x * $x, range(1, 5)));\n',
    cs: 'using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello from C#!");\n    }\n}\n',
    ts: 'interface User { name: string }\nconst u: User = { name: "TypeScript" };\nconsole.log(`Hello from ${u.name}!`);\n',
    lua: 'print("Hello from Lua!")\n', pl: 'print "Hello from Perl!\\n";\n', r: 'cat("Hello from R!\\n")\nprint(summary(c(1, 2, 3, 4, 5)))\n',
    sh: '#!/bin/bash\necho "Hello from Bash!"\nfor i in 1 2 3; do echo "line $i"; done\n',
    sql: "CREATE TABLE people(name TEXT, age INT);\nINSERT INTO people VALUES ('Ada', 36), ('Linus', 28);\nSELECT * FROM people ORDER BY age;\n",
    hs: 'main :: IO ()\nmain = putStrLn "Hello from Haskell!"\n', scala: '@main def hello() = println("Hello from Scala!")\n',
    html: '<!doctype html>\n<html>\n<body>\n  <h1>Hello, Mac!</h1>\n  <button onclick="alert(\'Hi!\')">Click me</button>\n  <script>\n    console.log("Page loaded at", new Date().toLocaleTimeString());\n  <\/script>\n</body>\n</html>\n',
    css: 'body {\n  font-family: system-ui;\n  color: #0a84ff;\n}\n', md: '# Title\n\nSome **bold** text.\n', txt: '',
  };

  // Reads one line of keyboard input inside a worker. When the program runs interactively it

    }).catch(e => postMessage({ t: 'fatal', s: String(e) }));

      } catch (err) {
        let m = String(err.message || err);
        const i = m.indexOf('File "<exec>"'); if (i > 0) m = 'Traceback (most recent call last):\\n  ' + m.slice(i);
        flush(); postMessage({ t: 'err', s: m.trimEnd() + '\\n' });
      }
      flush(); postMessage({ t: 'done' });
    };`;

  const blobWorker = src => new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  const sessions = {}; // named persistent workers: 'py' / 'js' (REPLs), 'py-run' / 'js-run' (scripts)

  function session(kind) {
    if (sessions[kind]) return sessions[kind];
    const isPy = kind.startsWith('py');
    const w = blobWorker(isPy ? PY_WORKER : JS_WORKER);
    const s = sessions[kind] = { w, queue: Promise.resolve(), ready: !isPy, handlers: null };
    w.onmessage = e => {
      const d = e.data;
      if (d.t === 'ready') { s.ready = true; s.onReady?.(); return; }
      if (d.t === 'fatal') { s.handlers?.err?.('Python failed to load: ' + d.s + '\n(Python needs an internet connection the first time.)\n'); s.handlers?.done?.(); kill(kind); return; }
      if (!s.handlers) return;
      if (d.t === 'input') { s.handlers.input?.(); return; }
      if (d.t === 'done') { const h = s.handlers; s.handlers = null; h.done(); }
      else (d.t === 'err' ? s.handlers.err : s.handlers.out)(d.s, d.t);
    };
    w.onerror = e => { s.handlers?.err?.(String(e.message || e) + '\n'); };
    return s;
  }
  function kill(kind) { const s = sessions[kind]; if (s) { s.w.terminate(); delete sessions[kind]; } }

  // Run a message in a named session. Returns { promise, cancel }.
  function exec(kind, msg, { out = () => {}, err = () => {}, status = () => {}, input } = {}) {
    const s = session(kind);
    if (!s.ready) { status('Loading Python… (the first time takes a few seconds)'); s.onReady = () => status(''); }
    let cancel;
    const promise = new Promise(res => {
      cancel = () => { kill(kind); if (msg.sid) sendInput(msg.sid, null); err(kind.startsWith('py') ? '\nKeyboardInterrupt\n' : '^C\n'); res(); };
      s.queue = s.queue.then(() => new Promise(done => {
        if (!sessions[kind]) { done(); return res(); }
        s.handlers = { out, err, input, done: () => { done(); res(); } };
        s.w.postMessage(msg);
      }));
    });
    return { promise, cancel };
  }

  /* ---------- compiled languages: Wandbox ---------- */
  let listP = null;
  const compilers = () => listP ||= fetch('https://wandbox.org/api/list.json').then(r => r.json()).catch(e => { listP = null; throw e; });
  async function pickCompiler(lang) {
    const all = (await compilers()).filter(c => c.language === lang);
    if (!all.length) throw new Error(`no compiler available for ${lang}`);
    const pref = PREFER[lang];
    return (pref && all.find(c => c.name.startsWith(pref))) || all.find(c => !/head/.test(c.name)) || all[0];
  }
  function remote(lang, code, input, { out = () => {}, err = () => {}, status = () => {} }) {
    const ctl = new AbortController();
    const promise = (async () => {
      try {
        status(`Compiling ${lang}…`);
        const c = await pickCompiler(lang);
        if (lang === 'Java') code = code.replace(/public\s+((?:final\s+|abstract\s+)*)class\s+/g, '$1class '); // compiled as prog.java
        const r = await fetch('https://wandbox.org/api/compile.json', { method: 'POST', signal: ctl.signal, headers: { 'content-type': 'application/json' }, body: JSON.stringify({ compiler: c.name, code, stdin: input || '' }) });
        status('');
        if (!r.ok) throw new Error(`the compiler service answered ${r.status}`);
        const j = await r.json();
        if (j.compiler_error) err(j.compiler_error.replace(/prog\.\w+/g, 'main'));
        if (j.program_output) out(j.program_output);
        if (j.program_error) err(j.program_error);
        if (j.signal) err(`Process killed: ${j.signal}\n`);
        if (j.status && j.status !== '0' && !j.compiler_error && !j.program_error) err(`(exit code ${j.status})\n`);
      } catch (e) {
        status('');
        if (e.name !== 'AbortError') err(`Could not run ${lang}: ${e.message}. Compiled languages need an internet connection.\n`);
      }
    })();
    return { promise, cancel: () => { ctl.abort(); err('^C\n'); } };
  }

  // send one line of keyboard input to a running program (null = end of input)
  function sendInput(sid, line) {
    if (!sid) return;
    fetch(`/stdin/${line == null ? 'eof' : 'send'}?sid=${sid}`, { method: 'POST', body: line ?? '' }).catch(() => {});
  }

  // Run a whole program. onInput(sid) is called when it waits for keyboard input.
  function run(ext, code, { input = '', out, err, status, onInput } = {}) {
    ext = (ext || '').toLowerCase();
    const L = LANGS[ext];
    if (!L) { err?.(`Don't know how to run .${ext} files.\n`); return { promise: Promise.resolve(), cancel() {} }; }
    const sid = onInput && OS.proxy ? Math.random().toString(36).slice(2) : null;
    const live = { sid, origin: location.origin, input };
    let r;
    if (ext === 'py') { kill('py-run'); r = exec('py-run', { code, ...live }, { out, err, status, input: () => onInput?.(sid) }); }
    else if (ext === 'js' || ext === 'mjs') {
      kill('js-run');
      const wrapped = /\bawait\b/.test(code) ? `(async () => {\n${code}\n})()` : code;
      r = exec('js-run', { code: wrapped, ...live }, { out, err, input: () => onInput?.(sid) });
    } else r = remote(L[1], code, input, { out, err, status });
    r.sid = sid;
    return r;
  }

  // SQLite (sql.js), loaded on demand
  let sqlP = null;
  function sql() {
    const base = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/';
    return sqlP ||= new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = base + 'sql-wasm.js';
      s.onload = () => initSqlJs({ locateFile: f => base + f }).then(res, rej);
      s.onerror = () => { sqlP = null; rej(new Error('SQLite needs an internet connection the first time')); };
      document.head.appendChild(s);
    });
  }
  // does this program read from the keyboard? (compiled programs get their input before they run)
  const readsInput = code => /\b(scanf|cin\s*>>|getline|Scanner|BufferedReader|readLine|read_line|gets|fgets|STDIN|readline|io\.read|bufio|fmt\.Scan|Console\.ReadLine|stdin)\b/.test(code);

  return {
    LANGS, TEMPLATES, run, exec, kill, sendInput, sql, readsInput,
    isLocal: ext => ['py', 'js', 'mjs'].includes((ext || '').toLowerCase()),
    langOf: ext => LANGS[(ext || '').toLowerCase()]?.[0] || null,
    canRun: ext => !!LANGS[(ext || '').toLowerCase()],
    pip: (pkgs, h) => exec('py', { pip: pkgs }, h),
  };
})();

</script>
<script>
/* js/apps.js */
// App registry + built-in apps
const Apps = (() => {
  const reg = {};
  const define = (id, def) => { reg[id] = { id, ...def }; };
  const get = id => reg[id];
  const all = () => Object.values(reg);
  const isInstalled = id => { const a = reg[id]; return !!a && (a.builtin || a.web || OS.state.installed.includes(id)); };
  const installed = () => all().filter(a => isInstalled(a.id) && !a.hidden);

  function icon(id, size = 48) {
    const a = reg[id];
    if (!a) return '';
    const ic = a.icon || {};
    const g = typeof ic.g === 'function' ? ic.g() : ic.g || '';
    return `<div class="icon" style="width:${size}px;height:${size}px;font-size:${size * 0.55}px;background:${ic.bg || '#8e8e93'}">${ic.svg || g}</div>`;
  }

  function launch(id, arg) {
    const a = reg[id];
    if (!a) return OS.toast('Application not found', id, '⚠️');
    if (!isInstalled(id)) { OS.toast(`${a.name} isn’t installed`, 'Get it from the App Store.', '🛍️'); return launch('appstore', id); }
    if (a.single) {
      const w = WM.byApp(id)[0];
      if (w) { WM.restore(w); if (arg !== undefined) w.api.open?.(arg); return w; }
    }
    return a.launch(arg);
  }

  // keep /Applications, web apps and the dock in sync with OS.state
  function sync() {
    for (const w of OS.state.webapps) defineWeb(w);
    for (const a of all()) if (a.web && !OS.state.webapps.some(w => w.id === a.id)) delete reg[a.id];
    VFS.setApps(installed().filter(a => a.id !== 'launchpad').map(a => ({ id: a.id, name: a.name })));
    OS.refreshDock();
  }
  function install(id) {
    if (!OS.state.installed.includes(id)) OS.state.installed.push(id);
    sync(); OS.saveState();
    OS.toast(`${reg[id].name} installed`, OS.drive ? 'Saved to your drive.' : 'Temporary – it will be gone after restart unless a drive is connected.', '✅');
  }
  function uninstall(id) {
    WM.byApp(id).forEach(w => w.close());
    OS.state.installed = OS.state.installed.filter(x => x !== id);
    OS.state.webapps = OS.state.webapps.filter(w => w.id !== id);
    sync(); OS.saveState();
    OS.toast(`${reg[id]?.name || id} removed`, '', '🗑️');
  }
  function defineWeb(w) {
    define(w.id, { name: w.name, web: true, desc: w.url, icon: { bg: w.color || '#5e5ce6', g: esc(w.name[0]?.toUpperCase() || '?') }, launch: () => Safari(w.url, { app: w.id, title: w.name }) });
  }

  return { define, get, all, isInstalled, installed, icon, launch, sync, install, uninstall, defineWeb };
})();

/* ============ Finder ============ */
const FINDER_SVG = '<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#e9f1fb"/><path d="M0 0h56c-8 18-12 36-9 56h-6c-1 16 2 30 7 44H0z" fill="#1d8af2"/><rect x="28" y="30" width="6" height="16" rx="3" fill="#0d2b4f"/><rect x="68" y="30" width="6" height="16" rx="3" fill="#0d2b4f"/><path d="M24 70q26 16 54 0" stroke="#0d2b4f" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
Apps.define('finder', { name: 'Finder', builtin: true, desc: 'Browse your files and connect drives.', icon: { svg: FINDER_SVG, bg: '#e9f1fb' }, launch: p => Finder(p) });

function Finder(start) {
  let cwd = VFS.norm(start || VFS.home), selected = null, showHidden = false, query = '', listView = false, timer;
  const back = [], fwd = [];
  const off = VFS.onChange(() => { clearTimeout(timer); timer = setTimeout(render, 60); });
  const win = WM.open({ app: 'finder', width: 860, height: 520, className: 'sidebar-win finder', onClose: () => off() });
  const body = win.body;
  win.extra.innerHTML = `<button class="tb-btn f-back" title="Back">‹</button><button class="tb-btn f-fwd" title="Forward">›</button><button class="tb-btn f-view" title="Toggle list/icon view">☰</button><button class="tb-btn f-newf" title="New Folder">＋</button><button class="tb-btn f-imp" title="Import files from your computer">⇪</button><input class="input f-search" placeholder="Search">`;
  body.innerHTML = `<div class="f-wrap"><aside class="f-side"></aside><section class="f-main"><div class="f-grid" tabindex="0"></div><div class="f-status"><span class="f-path"></span><span class="f-note"></span></div></section></div>`;
  const side = $('.f-side', body), grid = $('.f-grid', body), backBtn = $('.f-back', win.el), fwdBtn = $('.f-fwd', win.el);

  backBtn.onclick = () => { if (back.length) { fwd.push(cwd); go(back.pop(), false); } };
  fwdBtn.onclick = () => { if (fwd.length) { back.push(cwd); go(fwd.pop(), false); } };
  $('.f-view', win.el).onclick = () => { listView = !listView; render(); };
  $('.f-newf', win.el).onclick = newFolder;
  $('.f-imp', win.el).onclick = () => OS.importFiles(cwd);
  $('.f-search', win.el).oninput = e => { query = e.target.value.toLowerCase(); render(); };

  async function newFolder() {
    const n = await OS.prompt('New Folder', 'untitled folder');
    if (n) try { await VFS.mkdir(await VFS.uniquePath(cwd, n)); } catch (e) { OS.toast('Error', e.message, '⚠️'); }
  }

  function renderSide() {
    const H = VFS.home;
    const fav = [['🏠', OS.state.user, H], ['🖥️', 'Desktop', H + '/Desktop'], ['📄', 'Documents', H + '/Documents'], ['⬇️', 'Downloads', H + '/Downloads'], ['🖼️', 'Pictures', H + '/Pictures'], ['🎵', 'Music', H + '/Music'], ['🅰️', 'Applications', '/Applications']];
    const ms = VFS.mounts();
    side.innerHTML = '<div class="side-h">Favorites</div>' +
      fav.map(([i, n, p]) => `<div class="side-i${p === cwd ? ' on' : ''}" data-p="${esc(p)}">${i} ${esc(n)}</div>`).join('') +
      '<div class="side-h">Locations</div>' +
      `<div class="side-i${cwd === '/' ? ' on' : ''}" data-p="/">💻 Macintosh HD</div>` +
      ms.map(m => `<div class="side-i${cwd === m.path || cwd.startsWith(m.path + '/') ? ' on' : ''}" data-p="${esc(m.path)}">💽 ${esc(m.name)}<span class="eject" data-ej="${esc(m.name)}" title="Eject">⏏</span></div>`).join('') +
      `<div class="side-i connect">➕ Connect Drive…</div>` +
      `<div class="side-h">More</div><div class="side-i${cwd === H + '/.Trash' ? ' on' : ''}" data-p="${esc(H)}/.Trash">🗑️ Trash</div>`;
  }
  side.onclick = e => {
    const ej = e.target.closest('[data-ej]');
    if (ej) { e.stopPropagation(); if (cwd.startsWith('/Volumes/' + ej.dataset.ej)) go(VFS.home); OS.ejectDrive(ej.dataset.ej); return; }
    const it = e.target.closest('.side-i');
    if (!it) return;
    if (it.classList.contains('connect')) OS.connectDrive().then(p => p && go(p));
    else go(it.dataset.p);
  };

  async function go(p, push = true) {
    p = VFS.norm(p);
    const s = await VFS.stat(p);
    if (!s || s.type !== 'dir') { OS.toast('Folder not available', p, '⚠️'); return; }
    if (push && p !== cwd) { back.push(cwd); fwd.length = 0; }
    cwd = p; selected = null;
    render();
  }
  win.api.open = p => go(p);

  async function render() {
    if (!(await VFS.stat(cwd))) cwd = VFS.home;
    win.setTitle(cwd === '/' ? 'Macintosh HD' : cwd === VFS.home + '/.Trash' ? 'Trash' : VFS.basename(cwd));
    renderSide();
    let items;
    try { items = await VFS.list(cwd); } catch (e) { grid.innerHTML = `<div class="f-empty">${esc(e.message)}</div>`; return; }
    if (!showHidden) items = items.filter(i => !i.name.startsWith('.'));
    if (query) items = items.filter(i => i.name.toLowerCase().includes(query));
    grid.className = 'f-grid' + (listView ? ' list' : '');
    grid.innerHTML = items.length ? '' : `<div class="f-empty">${query ? 'No results' : cwd.endsWith('/.Trash') ? 'Trash is empty' : 'This folder is empty — drop files here to import them'}</div>`;
    for (const it of items) {
      const kind = it.type === 'dir' ? (it.mount ? 'Drive' : 'Folder') : it.type === 'app' ? 'Application' : fmtSize(it.size);
      const d = el(`<div class="f-item" title="${esc(it.name)}">${OS.fileIcon(it, listView ? 18 : 56)}<span>${esc(it.name)}</span><em>${fmtDate(it.mtime)}</em><em>${kind}</em></div>`);
      d.onclick = e => { e.stopPropagation(); $$('.f-item.sel', grid).forEach(x => x.classList.remove('sel')); d.classList.add('sel'); selected = it; };
      d.ondblclick = () => it.type === 'dir' ? go(it.path) : OS.open(it);
      d.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); d.onclick(e); OS.itemMenu(it, e.clientX, e.clientY); };
      grid.appendChild(d);
    }
    $('.f-path', body).textContent = cwd;
    const persistent = VFS.isPersistent(cwd);
    $('.f-note', body).innerHTML = `${items.length} item${items.length === 1 ? '' : 's'} · ` + (persistent ? '<span class="ok">💾 On your drive — saved permanently</span>' : '<span class="warn">⚠ Temporary — erased on restart</span>');
    backBtn.disabled = !back.length; fwdBtn.disabled = !fwd.length;
  }

  grid.onclick = () => { $$('.f-item.sel', grid).forEach(x => x.classList.remove('sel')); selected = null; };
  grid.oncontextmenu = e => {
    if (e.target.closest('.f-item')) return;
    e.preventDefault();
    const isTrash = cwd === VFS.home + '/.Trash';
    OS.menu([
      { label: 'New Folder', action: newFolder },
      { label: 'New Text File', action: async () => { const p = await VFS.uniquePath(cwd, 'untitled.txt'); await VFS.write(p, ''); OS.openFile(p); } },
      { label: 'Import Files from Computer…', action: () => OS.importFiles(cwd) },
      { label: 'Paste Item', disabled: !OS.clip, action: async () => { try { await VFS.copy(OS.clip, await VFS.uniquePath(cwd, VFS.basename(OS.clip))); } catch (err) { OS.toast('Paste failed', err.message, '⚠️'); } } },
      '-',
      { label: showHidden ? 'Hide Hidden Files' : 'Show Hidden Files', action: () => { showHidden = !showHidden; render(); } },
      { label: listView ? 'View as Icons' : 'View as List', action: () => { listView = !listView; render(); } },
      { label: 'Open in Terminal', action: () => Apps.launch('terminal', cwd) },
      { label: 'Get Info', action: () => OS.getInfo(cwd) },
      isTrash ? '-' : null,
      isTrash ? { label: 'Empty Trash', action: OS.emptyTrash } : null,
    ], e.clientX, e.clientY);
  };
  const items = () => $('.f-item', grid);
  function selectAt(i) {
    const all = items(); if (!all.length) return;
    i = Math.max(0, Math.min(all.length - 1, i));
    all[i].click(); all[i].scrollIntoView({ block: 'nearest' });
  }
  const H = () => VFS.home;
  const need = f => () => selected ? f(selected) : OS.toast('Select an item first', '', '👆', 1500);
  win.api.actions = {
    newFolder,
    trash: need(it => OS.trash(it.path)),
    emptyTrash: () => OS.emptyTrash(),
    rename: need(async it => { const n = await OS.prompt('Rename', it.name); if (n && n !== it.name) VFS.move(it.path, VFS.join(VFS.dirname(it.path), n)).catch(e => OS.toast('Rename failed', e.message, '⚠️')); }),
    open: need(it => it.type === 'dir' ? go(it.path) : OS.open(it)),
    quickLook: need(it => it.type === 'dir' ? go(it.path) : OS.open(it)),
    up: () => go(VFS.dirname(cwd)),
    back: () => backBtn.click(), forward: () => fwdBtn.click(),
    arrow: c => { const all = items(), i = all.findIndex(x => x.classList.contains('sel')); const cols = listView ? 1 : Math.max(1, Math.floor(grid.clientWidth / (all[0]?.offsetWidth + 8 || 100))); const d = { Left: -1, Right: 1, Up: -cols, Down: cols }[c]; selectAt(i < 0 ? 0 : i + d); },
    info: () => OS.getInfo(selected ? selected.path : cwd),
    duplicate: need(async it => VFS.copy(it.path, await VFS.uniquePath(VFS.dirname(it.path), it.name.replace(/(\.[^.]+)?$/, ' copy$1')))),
    copy: need(it => { OS.clip = it.path; OS.toast('Copied', it.name, '📋', 1500); }),
    paste: async () => { if (!OS.clip) return; try { await VFS.copy(OS.clip, await VFS.uniquePath(cwd, VFS.basename(OS.clip))); } catch (e) { OS.toast('Paste failed', e.message, '⚠️'); } },
    iconView: () => { listView = false; render(); }, listView: () => { listView = true; render(); },
    hidden: () => { showHidden = !showHidden; render(); },
    search: () => $('.f-search', win.el).focus(),
    goHome: () => go(H()), goDesktop: () => go(H() + '/Desktop'), goDocuments: () => go(H() + '/Documents'),
    goDownloads: async () => { await VFS.mkdir(OS.downloadsDir()); go(OS.downloadsDir()); }, goApps: () => go('/Applications'), goComputer: () => go('/'),
    goTo: async () => { const p = await OS.prompt('Go to the folder:', cwd); if (p) go(p); },
    connect: () => OS.connectDrive().then(p => p && go(p)),
    eject: () => { const m = VFS.mounts().find(m => cwd === m.path || cwd.startsWith(m.path + '/')); if (!m) return OS.toast('Not on a drive', 'Open a drive first.', '⏏️'); go(H()); OS.ejectDrive(m.name); },
    terminalHere: () => Apps.launch('terminal', cwd),
  };
  // drag & drop files from your real computer
  grid.ondragover = e => { e.preventDefault(); grid.classList.add('drop'); };
  grid.ondragleave = () => grid.classList.remove('drop');
  grid.ondrop = async e => {
    e.preventDefault(); grid.classList.remove('drop');
    const files = [...(e.dataTransfer?.files || [])];
    for (const f of files) await VFS.write(await VFS.uniquePath(cwd, f.name), f);
    if (files.length) OS.toast('Imported', `${files.length} file(s) copied here`, '⬆️');
  };
  render();
  return win;
}

/* ============ Launchpad ============ */
Apps.define('launchpad', { name: 'Launchpad', builtin: true, icon: { bg: 'linear-gradient(#e5e5ea,#aeaeb2)', svg: '<svg viewBox="0 0 100 100">' + [0, 1, 2].flatMap(r => [0, 1, 2].map(c => `<rect x="${20 + c * 22}" y="${20 + r * 22}" width="16" height="16" rx="4" fill="${['#ff375f', '#ff9f0a', '#ffd60a', '#30d158', '#64d2ff', '#0a84ff', '#5e5ce6', '#bf5af2', '#ff2d55'][r * 3 + c]}"/>`)).join('') + '</svg>' }, launch: () => OS.toggleLaunchpad() });

/* ============ TextEdit ============ */
Apps.define('textedit', { name: 'TextEdit', builtin: true, desc: 'Write and edit text documents.', icon: { bg: 'linear-gradient(#fff,#e5e5ea)', g: '📝' }, launch: p => TextEdit(p) });

function TextEdit(path) {
  let file = path || null, dirty = false;
  const win = WM.open({ app: 'textedit', width: 680, height: 480 });
  const mono = path && EXT.code.includes(VFS.ext(path));
  win.body.innerHTML = `<div class="te-bar"><button class="btn small te-open">Open…</button><button class="btn small te-save">Save</button><select class="field te-size"><option>12</option><option>13</option><option selected>14</option><option>16</option><option>18</option><option>24</option></select><label><input type="checkbox" class="te-mono" ${mono ? 'checked' : ''}> Monospace</label><span class="grow"></span><span class="te-save-state"></span></div><textarea class="te-text${mono ? ' mono' : ''}" spellcheck="false"></textarea>`;
  const ta = $('.te-text', win.body), st = $('.te-save-state', win.body);
  const upd = () => {
    win.setTitle((file ? VFS.basename(file) : 'Untitled') + (dirty ? ' — Edited' : ''));
    st.innerHTML = !file ? '<span class="warn">Not saved</span>' : VFS.isPersistent(file) ? '<span class="ok">💾 on drive</span>' : '<span class="warn">⚠ temporary location</span>';
  };
  const load = async p => {
    try { ta.value = await VFS.read(p); file = VFS.norm(p); dirty = false; upd(); }
    catch (e) { OS.toast('Cannot open', e.message, '⚠️'); }
  };
  win.api.save = async (as) => {

    find: () => findInText(ta), findNext: () => findInText(ta, true),

Apps.define('notes', { name: 'Notes', builtin: true, single: true, desc: 'Quick notes. Stored on your drive when one is connected.', icon: { bg: 'linear-gradient(#ffd60a 0 26%,#fffdf2 26%)', svg: '<svg viewBox="0 0 100 100"><rect y="26" width="100" height="74" fill="#fffdf2"/><path d="M14 46h72M14 62h72M14 78h72" stroke="#d6d1bf" stroke-width="3"/></svg>' }, launch: () => Notes() });

function Notes() {
  const dir = () => (OS.drive || VFS.home) + '/Notes';
  let notes = [], cur = null, timer;
  const win = WM.open({ app: 'notes', width: 800, height: 500, className: 'sidebar-win notes' });
  win.extra.innerHTML = '<button class="tb-btn n-new" title="New note">✎</button><button class="tb-btn n-del" title="Delete note">🗑</button>';
  win.body.innerHTML = '<div class="n-wrap"><aside class="n-side"><div class="n-list"></div></aside><section class="n-main"><textarea class="n-text" placeholder="Start typing…"></textarea><div class="n-foot"></div></section></div>';
  const list = $('.n-list', win.body), ta = $('.n-text', win.body), foot = $('.n-foot', win.body);

  async function load(selPath) {
    await VFS.mkdir(dir());
    const files = (await VFS.list(dir())).filter(f => f.type === 'file' && f.name.endsWith('.txt'));
    notes = await Promise.all(files.map(async f => ({ ...f, text: await VFS.read(f.path).catch(() => '') })));
    notes.sort((a, b) => b.mtime - a.mtime);
    if (!notes.length) { await newNote('New Note\n'); return; }
    cur = notes.find(n => n.path === selPath) || notes.find(n => n.path === cur?.path) || notes[0];
    draw();
    ta.value = cur.text;
  }
  function draw() {
    list.innerHTML = notes.map(n => { const [t, ...r] = n.text.split('\n'); return `<div class="n-item${n === cur ? ' on' : ''}" data-p="${esc(n.path)}"><b>${esc(t || 'New Note')}</b><small>${fmtDate(n.mtime)} · ${esc(r.join(' ').slice(0, 60) || 'No additional text')}</small></div>`; }).join('');
    win.setTitle('Notes');
    foot.innerHTML = OS.drive ? `<span class="ok">💾 Saved on drive “${esc(VFS.basename(OS.drive))}”</span> · ${notes.length} notes` : `<span class="warn">⚠ Temporary — connect a drive to keep notes</span> · ${notes.length} notes`;
  }
  async function newNote(text = '') {
    const p = VFS.join(dir(), `note-${Date.now()}.txt`);
    await VFS.write(p, text);
    await load(p);
    ta.focus();
  }
  list.onclick = e => { const it = e.target.closest('.n-item'); if (!it) return; cur = notes.find(n => n.path === it.dataset.p); ta.value = cur.text; draw(); };
  ta.oninput = () => {
    if (!cur) return;
    cur.text = ta.value; cur.mtime = Date.now();
    draw();
    clearTimeout(timer);
    const c = cur;
    timer = setTimeout(() => VFS.write(c.path, c.text).catch(e => OS.toast('Note not saved', e.message, '⚠️')), 400);
  };
  win.api.actions = { newNote: () => newNote(''), deleteNote: () => $('.n-del', win.el).click(), find: () => findInText(ta), findNext: () => findInText(ta, true) };
  $('.n-new', win.el).onclick = () => newNote('');
  $('.n-del', win.el).onclick = async () => { if (cur && await OS.confirm('Delete this note?', '', 'Delete')) { await VFS.rm(cur.path); cur = null; load(); } };
  load();
  return win;
}

/* ============ Safari ============ */
Apps.define('safari', { name: 'Safari', builtin: true, desc: 'Browse any website. Default search: Bing.', icon: { bg: 'linear-gradient(#fff,#d1d1d6)', svg: '<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f2f2f7"/><circle cx="50" cy="50" r="38" fill="#1a8cff"/><circle cx="50" cy="50" r="33" fill="#5ac8fa"/><path d="M50 50 70 30 56 56z" fill="#ff3b30"/><path d="M50 50 30 70 44 44z" fill="#fff"/></svg>' }, launch: u => Safari(u) });

const SAFARI_FAVS = [
  ['Bing', 'https://www.bing.com/', 'linear-gradient(135deg,#00809d,#0ab4cf)', 'b'],
  ['Google', 'https://www.google.com/', '#4285f4', 'G'],
  ['YouTube', 'https://www.youtube.com/', '#ff0000', '▶'],
  ['Wikipedia', 'https://en.wikipedia.org/', '#636366', 'W'],
  ['GitHub', 'https://github.com/', '#24292f', '🐙'],
  ['Reddit', 'https://old.reddit.com/', '#ff4500', '👽'],
  ['Maps', 'https://www.openstreetmap.org/', '#30d158', '🗺'],
  ['Archive', 'https://archive.org/', '#1c1c1e', '🏛'],
  ['hello.html', '~/Documents/hello.html', '#ff9f0a', '📄'],
];
function searchUrl(q) {
  const [, base] = SEARCH_ENGINES[OS.state.searchEngine] || SEARCH_ENGINES.bing;
  let u = base + encodeURIComponent(q);
  if (!OS.proxy && OS.state.searchEngine === 'google') u += '&igu=1'; // google allows embedding with igu=1
  return u;
}
function Safari(start, opts = {}) {
  const hist = []; let pos = -1, blobUrl = null, current = null;
  const engine = () => SEARCH_ENGINES[OS.state.searchEngine]?.[0] || 'Bing';
  const win = WM.open({ app: opts.app || 'safari', title: opts.title || 'Safari', width: 1040, height: 660, className: 'safari', onClose: () => { removeEventListener('message', onMsg); if (blobUrl) URL.revokeObjectURL(blobUrl); } });
  win.extra.innerHTML = `<button class="tb-btn s-back" title="Back">‹</button><button class="tb-btn s-fwd" title="Forward">›</button><button class="tb-btn s-home" title="Start Page">⌂</button>
    <input class="s-url" placeholder="Search with ${engine()} or enter website" spellcheck="false">
    <button class="tb-btn s-reload" title="Reload">↻</button><button class="tb-btn s-star" title="Add bookmark">☆</button><button class="tb-btn s-dl" title="Downloads">⬇</button><button class="tb-btn s-more" title="More">⋯</button>`;
  win.body.innerHTML = `<div class="s-bm-bar"></div><div class="s-loading"></div>
    <div class="s-start"><h1>${APPLE_SVG.replace('class="apple"', 'class="apple" style="width:34px;fill:var(--text)"')}</h1><input class="s-search" placeholder="Search with ${engine()} or type a website" spellcheck="false"><h2>Favorites</h2><div class="s-favs"></div></div>
    <iframe class="s-frame hidden" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
    <div class="s-note"></div>`;
  const url = $('.s-url', win.el), frame = $('.s-frame', win.body), startPage = $('.s-start', win.body), bar = $('.s-loading', win.body), star = $('.s-star', win.el);
  const favs = () => [...SAFARI_FAVS.map(([n, u, c, g]) => ({ name: n, url: u, color: c, glyph: g })), ...OS.state.bookmarks.map(b => ({ ...b, color: '#8e8e93', glyph: (b.name[0] || '★').toUpperCase(), user: true }))];
  function drawChrome() {
    const fs = favs();
    $('.s-bm-bar', win.body).innerHTML = fs.map((f, i) => `<span data-i="${i}" title="${esc(f.url)}">${esc(f.name)}</span>`).join('');
    $('.s-favs', win.body).innerHTML = fs.map((f, i) => `<div class="s-fav" data-i="${i}">${f.user ? `<span class="x" data-x="${i}" title="Remove">×</span>` : ''}<div class="icon" style="background:${f.color}">${esc(f.glyph)}</div>${esc(f.name)}</div>`).join('');
    const marked = !!current && OS.state.bookmarks.some(b => b.url === current);
    star.classList.toggle('on', marked);
    star.textContent = marked ? '★' : '☆';
    $('.s-note', win.body).innerHTML = OS.proxy
      ? '🌐 Any-website mode is on. Logins and some video sites may not fully work here — use ⋯ → Open in real browser for those.'
      : '<span class="warn">⚠ Many sites block being shown here. Start the Mac with “Start Mac.bat” to open any website.</span>';
  }
  async function resolve(q) {
    q = q.trim();
    if (/^(~|\/)/.test(q)) {
      const blob = await VFS.readBlob(q);
      const type = { html: 'text/html', htm: 'text/html', svg: 'image/svg+xml', pdf: 'application/pdf', txt: 'text/plain' }[VFS.ext(q)] || blob.type || 'text/plain';
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(new Blob([blob], { type }));
      return { src: blobUrl, show: VFS.norm(q), local: true };
    }
    let u = q;
    if (!/^https?:\/\//i.test(u)) u = /^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(q) ? 'https://' + q : searchUrl(q);
    return { src: OS.proxy ? `${OS.proxy}/proxy?url=${encodeURIComponent(u)}` : u, show: u };
  }
  async function nav(q, push = true) {
    if (!q) return home();
    try {
      const r = await resolve(q);
      // local files never get same-origin rights; websites run on the separate proxy origin
      frame.setAttribute('sandbox', r.local ? 'allow-scripts allow-forms allow-modals allow-popups' : 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-presentation');
      startPage.classList.add('hidden'); frame.classList.remove('hidden');
      bar.className = 's-loading'; void bar.offsetWidth; bar.className = 's-loading go';
      frame.src = r.src; url.value = r.show; current = r.show;
      if (!opts.title) win.setTitle(r.local ? VFS.basename(r.show) : new URL(r.show).hostname.replace(/^www\./, ''));
      if (push) { hist.splice(pos + 1); hist.push(r.show); pos = hist.length - 1; }
      drawChrome();
    } catch (e) { OS.toast('Can’t open page', e.message, '⚠️'); }
  }
  frame.onload = () => { bar.className = 's-loading done'; };
  function home() { frame.classList.add('hidden'); frame.src = 'about:blank'; startPage.classList.remove('hidden'); url.value = ''; current = null; win.setTitle(opts.title || 'Safari'); drawChrome(); setTimeout(() => $('.s-search', win.body).focus(), 30); }
  // messages from the page shown inside Safari (link clicks, downloads, page titles)
  function onMsg(e) {
    if (e.source !== frame.contentWindow || !e.data?.__safari) return;
    const d = e.data;
    if (d.type === 'nav' || d.type === 'newtab') nav(d.url);
    else if (d.type === 'download') OS.downloadUrl(d.url, d.name);
    else if (d.type === 'loaded') {
      bar.className = 's-loading done';
      if (d.url && d.url !== current) { current = d.url; url.value = d.url; if (pos >= 0) hist[pos] = d.url; }
      if (!opts.title) win.setTitle(d.title || new URL(d.url).hostname);
      drawChrome();
    }
  }
  addEventListener('message', onMsg);
  url.onkeydown = e => { if (e.key === 'Enter') { nav(url.value); url.blur(); } };
  url.onfocus = () => url.select();
  $('.s-search', win.body).onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) nav(e.target.value); };
  $('.s-back', win.el).onclick = () => { if (pos > 0) nav(hist[--pos], false); else home(); };
  $('.s-fwd', win.el).onclick = () => { if (pos < hist.length - 1) nav(hist[++pos], false); };
  $('.s-home', win.el).onclick = home;
  $('.s-reload', win.el).onclick = () => { if (pos >= 0) nav(hist[pos], false); };
  star.onclick = async () => {
    if (!current) return OS.toast('Nothing to bookmark', 'Open a website first.', '☆');
    const i = OS.state.bookmarks.findIndex(b => b.url === current);
    if (i >= 0) OS.state.bookmarks.splice(i, 1);
    else { const name = await OS.prompt('Add Bookmark', win.title || current); if (!name) return; OS.state.bookmarks.push({ name, url: current }); }
    OS.saveState(); drawChrome();
  };
  $('.s-dl', win.el).onclick = e => { const r = e.currentTarget.getBoundingClientRect(); OS.downloadsMenu(r.left - 150, r.bottom + 4); };
  $('.s-more', win.el).onclick = e => {
    const r = e.currentTarget.getBoundingClientRect(), web = !!current && !/^(~|\/)/.test(current);
    OS.menu([
      { label: 'New Window', action: () => Safari() },
      { label: 'Open in real browser ↗', disabled: !web, action: () => window.open(current, '_blank', 'noopener') },
      { label: 'Download this page / file', disabled: !web, action: () => OS.downloadUrl(current) },
      { label: 'Add to Dock as App…', disabled: !web, action: async () => {
        const name = await OS.prompt('Add to Dock', (win.title || 'Web App').slice(0, 24)); if (!name) return;
        OS.state.webapps.push({ id: 'web-' + Date.now().toString(36), name, url: current, color: ACCENTS[OS.state.webapps.length % ACCENTS.length] });
        Apps.sync(); OS.saveState(); OS.toast(`${name} added`, 'It’s now in your Dock and Launchpad.', '🌐');
      } },
      { label: 'Copy Link', disabled: !current, action: () => navigator.clipboard?.writeText(current) },
      '-',
      ...Object.entries(SEARCH_ENGINES).map(([k, [n]]) => ({ label: 'Search with ' + n, checked: OS.state.searchEngine === k, action: () => { OS.set({ searchEngine: k }); url.placeholder = `Search with ${n} or enter website`; $('.s-search', win.body).placeholder = `Search with ${n} or type a website`; } })),
    ], r.right - 220, r.bottom + 4);
  };
  const pick = e => {
    const x = e.target.closest('[data-x]');
    if (x) { e.stopPropagation(); const f = favs()[+x.dataset.x]; OS.state.bookmarks = OS.state.bookmarks.filter(b => b.url !== f.url); OS.saveState(); return drawChrome(); }
    const it = e.target.closest('[data-i]'); if (it) nav(favs()[+it.dataset.i].url);
  };
  startPage.onclick = pick;
  $('.s-bm-bar', win.body).onclick = pick;
  win.api.open = q => nav(q);
  let zoom = 1;
  const send = m => frame.contentWindow?.postMessage({ __safariCmd: 1, ...m }, '*');
  win.api.actions = {
    focusUrl: () => { url.focus(); url.select(); },
    newWindow: () => Safari(),
    reload: () => $('.s-reload', win.el).click(),
    back: () => $('.s-back', win.el).click(), forward: () => $('.s-fwd', win.el).click(),
    home, bookmark: () => star.click(),
    downloads: () => $('.s-dl', win.el).click(),
    find: async () => { const q = await OS.prompt('Find on page', ''); if (q) send({ find: q }); },
    zoomIn: () => send({ zoom: zoom = Math.min(3, +(zoom + 0.1).toFixed(2)) }),
    zoomOut: () => send({ zoom: zoom = Math.max(0.3, +(zoom - 0.1).toFixed(2)) }),
    zoomReset: () => send({ zoom: zoom = 1 }),
  };
  drawChrome();
  if (start) nav(start); else setTimeout(() => $('.s-search', win.body).focus(), 60);
  return win;
}

/* ============ Calculator ============ */
Apps.define('calculator', { name: 'Calculator', builtin: true, icon: { bg: 'linear-gradient(#4a4a4e,#1c1c1e)', svg: '<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#2c2c2e"/>' + [0, 1, 2].flatMap(r => [0, 1, 2].map(c => `<circle cx="${25 + c * 25}" cy="${25 + r * 25}" r="9" fill="${c === 2 ? '#ff9f0a' : r === 0 ? '#a5a5a5' : '#636366'}"/>`)).join('') + '</svg>' }, launch: () => Calculator() });

function Calculator() {
  const win = WM.open({ app: 'calculator', width: 240, height: 370, resizable: false, className: 'calc-win', title: '' });
  const keys = ['AC', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '='];
  win.body.innerHTML = `<div class="calc" tabindex="0"><div class="calc-d">0</div><div class="calc-k">${keys.map(k => `<button class="${/[÷×−+=]/.test(k) ? 'op' : /AC|±|%/.test(k) ? 'fn' : ''}${k === '0' ? ' zero' : ''}">${k}</button>`).join('')}</div></div>`;
  const root = $('.calc', win.body), d = $('.calc-d', win.body);
  let cur = '0', acc = null, op = null, fresh = true;
  const calc = (a, b, o) => o === '+' ? a + b : o === '−' ? a - b : o === '×' ? a * b : o === '÷' ? a / b : b;
  const fmt = s => { if (!fresh && s.includes('.')) return s; const n = parseFloat(s); return !isFinite(n) ? 'Error' : Math.abs(n) >= 1e10 ? n.toExponential(5) : String(+n.toPrecision(10)); };
  function press(k) {
    if (/^\d$/.test(k)) { cur = fresh || cur === '0' ? k : (cur.length < 12 ? cur + k : cur); fresh = false; }
    else if (k === '.') { if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; }
    else if (k === 'AC') { cur = '0'; acc = null; op = null; fresh = true; }
    else if (k === '±') cur = String(-parseFloat(cur));
    else if (k === '%') cur = String(parseFloat(cur) / 100);
    else if (k === '=') { if (op && acc !== null) { cur = String(calc(acc, parseFloat(cur), op)); acc = null; op = null; fresh = true; } }
    else { if (op && acc !== null && !fresh) cur = String(calc(acc, parseFloat(cur), op)); acc = parseFloat(cur); op = k; fresh = true; }
    d.textContent = fmt(cur);
    d.style.fontSize = d.textContent.length > 9 ? '30px' : '46px';
    $$('.op', root).forEach(b => b.classList.toggle('on', b.textContent === op && fresh));
  }
  $('.calc-k', root).onclick = e => { const b = e.target.closest('button'); if (b) press(b.textContent); };
  root.onkeydown = e => {
    const map = { '/': '÷', '*': '×', '-': '−', '+': '+', Enter: '=', '=': '=', Escape: 'AC', Delete: 'AC', '%': '%', '.': '.', ',': '.' };
    if (/^\d$/.test(e.key)) press(e.key); else if (map[e.key]) { e.preventDefault(); press(map[e.key]); }
  };
  setTimeout(() => root.focus(), 60);
  return win;
}

/* ============ Activity Monitor ============ */
Apps.define('activity', { name: 'Activity Monitor', builtin: true, single: true, desc: 'See running apps and force quit them.', icon: { bg: 'linear-gradient(#2c2c2e,#000)', svg: '<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#111"/><path d="M10 60h18l8-24 12 44 10-30 6 10h26" stroke="#30d158" stroke-width="5" fill="none" stroke-linejoin="round"/></svg>' }, launch: () => ActivityMonitor() });
function ActivityMonitor() {
  let sel = null;
  const win = WM.open({ app: 'activity', width: 560, height: 380, onClose: () => clearInterval(t), className: 'am' });
  win.extra.innerHTML = '<button class="btn small am-kill">Force Quit</button>';
  const draw = () => {
    const rows = WM.all().map((w, i) => ({ w, pid: 300 + i * 7 + w.id.length, cpu: (Math.random() * (w.app === 'snake' ? 18 : 4)).toFixed(1), mem: (20 + (w.title.length * 3.7) % 180).toFixed(1) }));
    const mem = performance.memory ? `JS heap: ${fmtSize(performance.memory.usedJSHeapSize)} / ${fmtSize(performance.memory.jsHeapSizeLimit)}` : '';

  };
  win.api.open = s => { if (s) section = s; draw(); };
  OS.refreshSettings = () => draw();
  draw();
  return win;
}

<script>
/* js/terminal.js */
// Terminal: a zsh-like shell for the virtual Mac.
// Pipes (|), redirects (> >> < 2>), && || ;, $VARIABLES, aliases, *.globs, history, tab completion,
// Python / Node / SQLite prompts, running code files in 25+ languages, and a simple git.
Apps.define('terminal', { name: 'Terminal', builtin: true, desc: 'A zsh-like command line with Python, Node, compilers and git.', icon: { bg: 'linear-gradient(#4a4a4e,#1c1c1e)', g: '<span style="font-family:Menlo,Consolas,monospace;font-size:.62em;color:#fff">&gt;_</span>' }, launch: p => Terminal(p) });

const TERM_HIST = [];
const userId = () => VFS.basename(VFS.home);

/* ---------------- parsing ---------------- */
function varAt(line, i, env) {
  if (line[i + 1] === '{') { const j = line.indexOf('}', i); return { v: env[line.slice(i + 2, j)] ?? '', end: j + 1 }; }
  if (line[i + 1] === '?') return { v: String(env['?'] ?? 0), end: i + 2 };
  if (line[i + 1] === '$') return { v: '1337', end: i + 2 };
  const m = /^[A-Za-z_]\w*/.exec(line.slice(i + 1));
  return m ? { v: env[m[0]] ?? '', end: i + 1 + m[0].length } : { v: '$', end: i + 1 };
}
function lex(line, env) {
  const toks = []; let cur = null, quoted = false, glob = false, i = 0;
  const push = () => { if (cur !== null) toks.push({ v: cur, q: quoted, g: glob }); cur = null; quoted = false; glob = false; };
  while (i < line.length) {
    const c = line[i];
    if (c === ' ' || c === '\t') { push(); i++; continue; }
    if (c === "'") { const j = line.indexOf("'", i + 1); if (j < 0) throw new Error('unmatched quote'); cur = (cur ?? '') + line.slice(i + 1, j); quoted = true; i = j + 1; continue; }
    if (c === '"') {
      let j = i + 1, s = '';
      while (j < line.length && line[j] !== '"') {
        if (line[j] === '\\' && '"\\$`'.includes(line[j + 1])) { s += line[j + 1]; j += 2; continue; }
        if (line[j] === '$') { const m = varAt(line, j, env); s += m.v; j = m.end; continue; }
        s += line[j++];
      }
      if (j >= line.length) throw new Error('unmatched quote');
      cur = (cur ?? '') + s; quoted = true; i = j + 1; continue;
    }
    if (c === '\\' && i + 1 < line.length) { cur = (cur ?? '') + line[i + 1]; quoted = true; i += 2; continue; }
    const two = line.slice(i, i + 2);
    if (two === '&&' || two === '||' || two === '>>') { push(); toks.push({ op: two }); i += 2; continue; }
    if (two === '2>' && cur === null) { push(); toks.push({ op: line[i + 2] === '&' && line[i + 3] === '1' ? '2>&1' : '2>' }); i += line[i + 2] === '&' ? 4 : 2; continue; }
    if ('|;<>&'.includes(c)) { push(); if (c !== '&') toks.push({ op: c }); i++; continue; }
    if (c === '$') { const m = varAt(line, i, env); cur = (cur ?? '') + m.v; i = m.end; continue; }
    if (c === '#' && cur === null) break;
    if (c === '~' && cur === null && (line[i + 1] === undefined || line[i + 1] === '/' || line[i + 1] === ' ')) { cur = env.HOME; i++; continue; }
    if (c === '*' || c === '?') glob = true;
    cur = (cur ?? '') + c; i++;
  }
  push();
  return toks;
}
// split tokens into [{ cmds:[{words, redirs}], op }] chains
function parse(toks) {
  const chain = []; let pipe = [], cmd = { words: [], redirs: [] };
  const endCmd = () => { if (cmd.words.length || cmd.redirs.length) pipe.push(cmd); cmd = { words: [], redirs: [] }; };
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (!t.op) { cmd.words.push(t); continue; }
    if (t.op === '|') { endCmd(); continue; }
    if (['>', '>>', '<', '2>'].includes(t.op)) { const f = toks[++i]; if (!f || f.op) throw new Error(`parse error near \`${t.op}'`); cmd.redirs.push({ op: t.op, file: f.v }); continue; }
    if (t.op === '2>&1') { cmd.redirs.push({ op: '2>&1' }); continue; }
    endCmd(); chain.push({ pipe, op: t.op }); pipe = [];
  }
  endCmd(); if (pipe.length) chain.push({ pipe, op: null });
  return chain;
}
async function expandGlob(word, cwd) {
  const full = VFS.norm(word, cwd), dir = VFS.dirname(full), pat = VFS.basename(full);
  const re = new RegExp('^' + pat.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
  try {
    const hits = (await VFS.list(dir)).filter(i => re.test(i.name) && (pat.startsWith('.') || !i.name.startsWith('.'))).map(i => word.includes('/') ? VFS.join(VFS.dirname(word.startsWith('/') ? word : VFS.join(cwd, word)) , i.name) : i.name);
    return hits.length ? hits : [word];
  } catch { return [word]; }
}

function splitTop(line) {
  const parts = []; let cur = '', q = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i], two = line.slice(i, i + 2);
    if (q) { cur += c; if (c === q) q = null; else if (c === '\\' && q === '"') cur += line[++i] ?? ''; continue; }
    if (c === '"' || c === "'") { q = c; cur += c; continue; }
    if (c === '\\') { cur += c + (line[++i] ?? ''); continue; }
    if (two === '&&' || two === '||') { parts.push({ src: cur, op: two }); cur = ''; i++; continue; }
    if (c === ';') { parts.push({ src: cur, op: ';' }); cur = ''; continue; }
    if (c === '#' && (!cur || /\s$/.test(cur))) break;
    cur += c;
  }
  if (q) throw new Error('unmatched quote');
  parts.push({ src: cur, op: null });
  return parts.filter(p => p.src.trim() || p.op);
}

/* ---------------- small helpers ---------------- */
const lines = s => (s ?? '').replace(/\n$/, '').split('\n');
const flagsOf = a => { const f = new Set(), rest = []; for (const x of a) { if (/^-[a-zA-Z]+$/.test(x)) [...x.slice(1)].forEach(c => f.add(c)); else rest.push(x); } return [f, rest]; };
async function readInputs(files, io) {
  if (!files.length) { if (io.stdin == null) throw new Error('no input (give a file name or pipe something in)'); return [{ name: '', text: io.stdin }]; }
  const out = [];
  for (const f of files) out.push({ name: f, text: await VFS.read(io.p(f)) });
  return out;
}
async function sha(algo, text) {
  const h = await crypto.subtle.digest(algo, new TextEncoder().encode(text));

  let color = '#000000', tool = 'brush', drawing = false, last = null; const undo = [];
  function fit() {
    const img = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = box.clientWidth; cv.height = box.clientHeight;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    if (img) ctx.putImageData(img, 0, 0);
  }
  setTimeout(fit, 30);
  win.api.onResize = fit;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const snap = () => { undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 30) undo.shift(); };
  function flood([x, y]) {
    x |= 0; y |= 0;
    const img = ctx.getImageData(0, 0, cv.width, cv.height), d = img.data, w = cv.width, h = cv.height;
    const i0 = (y * w + x) * 4, t = [d[i0], d[i0 + 1], d[i0 + 2], d[i0 + 3]];
    const n = parseInt(color.slice(1), 16), f = [n >> 16, (n >> 8) & 255, n & 255, 255];
    if (t.every((v, i) => v === f[i])) return;
    const st = [[x, y]];
    const same = i => Math.abs(d[i] - t[0]) < 24 && Math.abs(d[i + 1] - t[1]) < 24 && Math.abs(d[i + 2] - t[2]) < 24;
    while (st.length) {
      const [px, py] = st.pop(); if (px < 0 || py < 0 || px >= w || py >= h) continue;
      const i = (py * w + px) * 4; if (!same(i)) continue;
      d[i] = f[0]; d[i + 1] = f[1]; d[i + 2] = f[2]; d[i + 3] = 255;
      st.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
    }
    ctx.putImageData(img, 0, 0);
  }
  cv.onpointerdown = e => {
    snap();
    if (tool === 'fill') return flood(pos(e));
    drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); cv.onpointermove(e);
  };
  cv.onpointermove = e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = tool === 'eraser' ? '#fff' : color;
    ctx.lineWidth = +$('.pt-size', win.body).value; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p;
  };
  cv.onpointerup = () => { drawing = false; };
  $('.pt-bar', win.body).onclick = async e => {
    const s = e.target.closest('.sw'), t = e.target.closest('[data-t]');
    if (s) { color = s.dataset.c; $$('.sw', win.body).forEach(x => x.classList.toggle('on', x === s)); if (tool === 'eraser') tool = 'brush'; }
    if (t) { tool = t.dataset.t; $$('[data-t]', win.body).forEach(x => x.classList.toggle('on', x === t)); }
    if (e.target.closest('.pt-undo') && undo.length) ctx.putImageData(undo.pop(), 0, 0);
    if (e.target.closest('.pt-clear')) { snap(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }
    if (e.target.closest('.pt-save')) {
      const p = await OS.saveDialog('drawing.png', (OS.drive || VFS.home + '/Pictures'));
      if (!p) return;
      cv.toBlob(async b => { await VFS.write(p, b); win.setTitle(VFS.basename(p) + ' — Paint'); OS.toast('Saved', p, '🎨'); });
    }
  };
  $('.pt-col', win.body).oninput = e => { color = e.target.value; };
  return win;
}

Apps.define('snake', { name: 'Snake', store: true, desc: 'The classic game. Arrow keys to move, Space to restart.', icon: { bg: 'linear-gradient(#34c759,#0b7a2c)', g: '🐍' }, launch: () => Snake() });
function Snake() {
  const N = 20, S = 18;
  let snake, dir, nextDir, food, score, over, loop, best = 0;
  const win = WM.open({ app: 'snake', width: 420, height: 490, resizable: false, onClose: () => clearInterval(loop) });
  win.body.innerHTML = `<div class="game" tabindex="0"><div><b class="sc">Score 0</b> · <span class="bs">Best 0</span></div><canvas width="${N * S}" height="${N * S}"></canvas><small style="color:#8e8e93">Arrow keys / WASD · Space to restart</small></div>`;
  const g = $('.game', win.body), cv = $('canvas', win.body), ctx = cv.getContext('2d');
  const place = () => { do food = [Math.random() * N | 0, Math.random() * N | 0]; while (snake.some(p => p[0] === food[0] && p[1] === food[1])); };
  function reset() { snake = [[8, 10], [7, 10], [6, 10]]; dir = nextDir = [1, 0]; score = 0; over = false; place(); clearInterval(loop); loop = setInterval(step, 110); }
  function step() {
    if (over) return;
    dir = nextDir;
    const h = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
    if (h[0] < 0 || h[1] < 0 || h[0] >= N || h[1] >= N || snake.some(p => p[0] === h[0] && p[1] === h[1])) { over = true; best = Math.max(best, score); draw(); return; }
    snake.unshift(h);
    if (h[0] === food[0] && h[1] === food[1]) { score++; place(); } else snake.pop();
    draw();
  }
  function draw() {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#ff375f'; ctx.beginPath(); ctx.arc(food[0] * S + S / 2, food[1] * S + S / 2, S / 2 - 2, 0, 7); ctx.fill();
    snake.forEach((p, i) => { ctx.fillStyle = i ? '#30d158' : '#7cf29a'; ctx.fillRect(p[0] * S + 1, p[1] * S + 1, S - 2, S - 2); });
    $('.sc', g).textContent = 'Score ' + score; $('.bs', g).textContent = 'Best ' + best;
    if (over) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Game Over', cv.width / 2, cv.height / 2); ctx.font = '14px sans-serif'; ctx.fillText('Press Space to play again', cv.width / 2, cv.height / 2 + 26); }
  }
  g.onkeydown = e => {
    const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
    if (m) { e.preventDefault(); if (m[0] !== -dir[0] || m[1] !== -dir[1]) nextDir = m; }
    if (e.key === ' ') { e.preventDefault(); reset(); }
  };
  reset(); setTimeout(() => g.focus(), 60);
  g.onclick = () => g.focus();
  return win;
}

function Clock() {
  const cities = [['Local', undefined], ['New Delhi', 'Asia/Kolkata'], ['London', 'Europe/London'], ['New York', 'America/New_York'], ['Tokyo', 'Asia/Tokyo'], ['Sydney', 'Australia/Sydney']];

  const cv = $('canvas', win.body), ctx = cv.getContext('2d');
  function tick() {
    const d = new Date(), r = 110;
    ctx.clearRect(0, 0, 240, 240); ctx.save(); ctx.translate(120, 120);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = '600 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 1; i <= 12; i++) { const a = i * Math.PI / 6; ctx.fillText(i, Math.sin(a) * 88, -Math.cos(a) * 88); }
    const hand = (a, len, w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(a) * len, -Math.cos(a) * len); ctx.stroke(); };
    const s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes() + s / 60, h = d.getHours() % 12 + m / 60;
    hand(h * Math.PI / 6, 55, 6, '#000'); hand(m * Math.PI / 30, 80, 4, '#000'); hand(s * Math.PI / 30, 90, 1.5, '#ff9f0a');
    ctx.fillStyle = '#ff9f0a'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill(); ctx.restore();
    $('.dig', win.body).textContent = d.toLocaleTimeString();
    $('.clock-cities', win.body).innerHTML = cities.map(([n, tz]) => `<div><small>${n}</small><b>${d.toLocaleTimeString(undefined, { timeZone: tz, hour: '2-digit', minute: '2-digit' })}</b></div>`).join('');

}

Apps.define('2048', { name: '2048', store: true, desc: 'Slide tiles and merge numbers to reach 2048.', icon: { bg: 'linear-gradient(#edc22e,#f2b179)', g: '<span style="font-size:.5em;color:#fff">2048</span>' }, launch: () => Game2048() });
function Game2048() {
  let b, score;
  const win = WM.open({ app: '2048', width: 360, height: 450, resizable: false });
  win.body.innerHTML = '<div class="game" tabindex="0" style="background:#faf8ef;color:#776e65"><b class="sc"></b><div class="g2" style="display:grid;grid-template-columns:repeat(4,64px);gap:8px;background:#bbada0;padding:8px;border-radius:8px"></div><small>Arrow keys · N for new game</small></div>';
  const g = $('.game', win.body), grid = $('.g2', g);
  const COL = { 0: '#cdc1b4', 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
  const add = () => { const e = []; b.forEach((v, i) => !v && e.push(i)); if (e.length) b[e[Math.random() * e.length | 0]] = Math.random() < .9 ? 2 : 4; };
  const reset = () => { b = Array(16).fill(0); score = 0; add(); add(); draw(); };
  const draw = () => {
    grid.innerHTML = b.map(v => `<div style="height:64px;border-radius:5px;display:grid;place-items:center;font:700 ${v > 512 ? 20 : 26}px sans-serif;background:${COL[v] || '#3c3a32'};color:${v > 4 ? '#fff' : '#776e65'}">${v || ''}</div>`).join('');
    $('.sc', g).textContent = 'Score ' + score;
  };
  function move(dx, dy) {
    let moved = false;
    for (let k = 0; k < 4; k++) {
      const idx = [0, 1, 2, 3].map(i => dx ? k * 4 + (dx > 0 ? 3 - i : i) : (dy > 0 ? 3 - i : i) * 4 + k);
      const vals = idx.map(i => b[i]).filter(Boolean);
      for (let i = 0; i < vals.length - 1; i++) if (vals[i] === vals[i + 1]) { vals[i] *= 2; score += vals[i]; vals.splice(i + 1, 1); }
      idx.forEach((i, j) => { const v = vals[j] || 0; if (b[i] !== v) moved = true; b[i] = v; });
    }
    if (moved) { add(); draw(); }
  }
  g.onkeydown = e => {
    const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (m) { e.preventDefault(); move(...m); }
    if (e.key === 'n') reset();
  };
  g.onclick = () => g.focus();
  reset(); setTimeout(() => g.focus(), 60);
  return win;
}
