// tiny find helper used by editors (Alt+F / Alt+G)
async function findInText(ta, next) {
  if (!next || !ta._find) { const q = await OS.prompt('Find', ta._find || ''); if (!q) return; ta._find = q; }
  const q = ta._find.toLowerCase(), v = ta.value.toLowerCase();
  let i = v.indexOf(q, ta.selectionEnd);
  if (i < 0) i = v.indexOf(q);
  if (i < 0) return OS.toast('Not found', ta._find, '🔍', 1500);
  ta.focus(); ta.setSelectionRange(i, i + q.length);
  const lineNo = ta.value.slice(0, i).split('\n').length;
  ta.scrollTop = Math.max(0, (lineNo - 5) * parseFloat(getComputedStyle(ta).lineHeight || 20));
}

// very small Markdown renderer (headings, lists, code, bold/italic, links, images, quotes, tables)
function mdToHtml(md) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" style="max-width:100%">').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*([^*]+)\*/g, '$1<i>$2</i>').replace(/~~([^~]+)~~/g, '<s>$1</s>');
  const out = []; let list = null, code = null, table = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } if (table) { out.push('</table>'); table = null; } };
  for (const raw of md.split('\n')) {
    if (code !== null) { if (/^```/.test(raw)) { out.push(`<pre style="background:#f2f2f7;padding:10px;border-radius:8px;overflow:auto"><code>${esc(code)}</code></pre>`); code = null; } else code += raw + '\n'; continue; }
    if (/^```/.test(raw)) { close(); code = ''; continue; }
    let m;
    if ((m = raw.match(/^(#{1,6})\s+(.*)/))) { close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = raw.match(/^\s*[-*+]\s+(\[[ x]\]\s+)?(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${m[1] ? (m[1].includes('x') ? '☑ ' : '☐ ') : ''}${inline(m[2])}</li>`); }
    else if ((m = raw.match(/^\s*\d+\.\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = raw.match(/^>\s?(.*)/))) { close(); out.push(`<blockquote style="border-left:4px solid #ccc;margin:0;padding-left:12px;color:#555">${inline(m[1])}</blockquote>`); }
    else if (/^\s*\|.*\|\s*$/.test(raw)) { if (/^\s*\|[\s:|-]+\|\s*$/.test(raw)) continue; const cells = raw.trim().slice(1, -1).split('|').map(c => inline(c.trim())); if (!table) { close(); out.push('<table border="1" style="border-collapse:collapse" cellpadding="6">'); table = 1; out.push('<tr>' + cells.map(c => `<th>${c}</th>`).join('') + '</tr>'); } else out.push('<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>'); }
    else if (/^\s*(---|\*\*\*)\s*$/.test(raw)) { close(); out.push('<hr>'); }
    else if (!raw.trim()) close();
    else { close(); out.push(`<p>${inline(raw)}</p>`); }
  }
  if (code !== null) out.push(`<pre><code>${esc(code)}</code></pre>`);
  close();
  return out.join('\n');
}

    if (tool === 'hash') { const { i, o } = two('<span class="dim">SHA-1, SHA-256, SHA-384, SHA-512 update as you type</span>', '', () => ''); i.oninput = async () => { const r = []; for (const a of ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512']) r.push(`${a}: ${await sha(a, i.value)}`); o.value = r.join('\n\n'); }; }

/* ============ Markdown Editor ============ */
Apps.define('markdown', { name: 'Markdown Editor', store: true, category: 'dev', desc: 'Write Markdown (README files, notes) with a live preview.', icon: { bg: 'linear-gradient(#fff,#e5e5ea)', g: '<span style="color:#1d1d1f;font-size:.42em;font-weight:800">M↓</span>' }, launch: p => MarkdownEditor(p) });
function MarkdownEditor(path) {
  let file = path ? VFS.norm(path) : null, dirty = false;
  const win = WM.open({ app: 'markdown', width: 1000, height: 620 });
  win.body.innerHTML = '<div class="md"><div class="te-bar"><button class="btn small md-save">Save</button><button class="btn small md-exp">Export HTML…</button><span class="grow"></span><span class="md-st"></span></div><div class="md-split"><textarea class="md-ta" spellcheck="true"></textarea><div class="md-pv"></div></div></div>';
  const ta = $('.md-ta', win.body), pv = $('.md-pv', win.body);
  const upd = () => { win.setTitle(`${file ? VFS.basename(file) : 'Untitled.md'}${dirty ? ' — Edited' : ''}`); $('.md-st', win.body).innerHTML = !file ? '<span class="warn">not saved</span>' : VFS.isPersistent(file) ? '<span class="ok">💾 drive</span>' : '<span class="warn">⚠ temporary</span>'; };
  const render = () => { pv.innerHTML = mdToHtml(ta.value); };
  ta.oninput = () => { dirty = true; upd(); clearTimeout(ta._t); ta._t = setTimeout(render, 150); };
  win.api.save = async as => { if (!file || as) { const p = await OS.saveDialog(file ? VFS.basename(file) : 'README.md'); if (!p) return; file = p; } await VFS.write(file, ta.value); dirty = false; upd(); };
  win.api.actions = { find: () => findInText(ta), findNext: () => findInText(ta, true) };
  $('.md-save', win.body).onclick = () => win.api.save();
  $('.md-exp', win.body).onclick = async () => { const p = await OS.saveDialog((file ? VFS.basename(file).replace(/\.md$/i, '') : 'document') + '.html'); if (p) VFS.write(p, `<!doctype html><meta charset="utf-8"><body style="font:16px/1.6 -apple-system,Segoe UI,sans-serif;max-width:760px;margin:40px auto;padding:0 16px">${mdToHtml(ta.value)}</body>`); };
  (async () => { ta.value = file ? await VFS.read(file).catch(() => '') : '# Hello Markdown\n\nWrite **bold**, *italic*, `code` and [links](https://example.com).\n\n- [x] Lists\n- [ ] Checklists\n\n| Language | Year |\n|---|---|\n| Python | 1991 |\n| Swift | 2014 |\n\n```python\nprint("code blocks")\n```\n'; render(); upd(); })();
  return win;
}

const SHORTCUTS_NOTE = `How the keys map:  Alt = ⌘ Command   ·   Ctrl = ⌃ Control   ·   Shift = ⇧ Shift
(Your real Windows key and Alt+Tab stay with Windows, so the Mac uses Alt for ⌘.)

For the best result start the Mac with "Start Mac.bat": it opens in its own app window,
where almost every shortcut reaches the Mac. In a normal browser tab a few keys
(like Ctrl+W, Ctrl+T, Ctrl+N, Alt+D, Alt+F, Alt+E) may be taken by the browser itself.
Windows always keeps: Alt+Tab, Alt+F4, Ctrl+Alt+Delete, the Windows key.`;

function shortcutsText() {
  const out = ['macOS Web Simulator — Keyboard Shortcuts', '='.repeat(42), '', SHORTCUTS_NOTE, ''];
  let g = null;
  for (const s of SHORTCUTS) {
    if (s.g !== g) { g = s.g; out.push('', g.toUpperCase(), '-'.repeat(g.length)); }
    const keys = s.k.join('  or  ');
    out.push(`  ${keys.padEnd(36)} ${s.d}${s.mac && s.mac !== 'same' && s.mac !== '—' ? `   [Mac: ${s.mac}]` : ''}`);
  }
  out.push('', '', 'MOUSE', '-----', '  Right-click (anywhere)               Context menu (files, desktop, Dock, Finder)', '  Double-click a file / folder           Open it', '  Drag files from Windows into Finder    Import them into the Mac', '  Drag a window title bar / corner       Move / resize the window', '  Move the mouse to the Dock             Magnify icons (turn off in Settings → Dock)');
  return out.join('\n') + '\n';
}
if (typeof module !== 'undefined') module.exports = { SHORTCUTS, shortcutsText };

/* =====================================================================================

if (typeof window !== 'undefined') {
  const KEYNAMES = { Space: 'Space', Backquote: '`', Comma: ',', Period: '.', Slash: '/', Backslash: '\\', BracketLeft: '[', BracketRight: ']', Equal: '=', Minus: '-', NumpadAdd: '=', NumpadSubtract: '-', Semicolon: ';', Quote: "'", ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right', Backspace: 'Backspace', Delete: 'Delete', Enter: 'Enter', NumpadEnter: 'Enter', Escape: 'Esc', Tab: 'Tab', Home: 'Home', End: 'End' };

    const inTerminal = t?.classList?.contains('term-in');

  /* ---------- Mission Control ---------- */
  const MC = { on: false };

    document.body.classList.add('mission');

    $('#windows').prepend(ov);
    const top = 50, bottom = 110, W = innerWidth, H = innerHeight - top - bottom;
    const cols = Math.max(1, Math.ceil(Math.sqrt(ws.length * (W / H) * 0.8))), rows = Math.ceil(ws.length / cols);
    const cw = W / cols, ch = H / rows;

      else { navigator.clipboard?.writeText(s.textContent); OS.toast('Copied', s.textContent + ' — paste it anywhere', '📋', 1500); }
    };
    $('.em-q', p).oninput = e => { const q = e.target.value.toLowerCase(); $$('.em-h', p).forEach(h => { const on = h.textContent.toLowerCase().includes(q); h.style.display = on ? '' : 'none'; h.nextElementSibling.style.display = on ? '' : 'none'; }); };
    setTimeout(() => document.addEventListener('pointerdown', function off(e) { if (!e.target.closest('#emoji')) { $('#emoji')?.remove(); document.removeEventListener('pointerdown', off, true); } }, true), 50);
  }

  /* ---------- the shortcuts file ---------- */
  OS.showShortcuts = async function () {
    const p = VFS.home + '/Desktop/Keyboard Shortcuts.txt';
    if (!(await VFS.stat(p))) await VFS.write(p, shortcutsText());
    OS.openFile(p, 'textedit');
  };
  const _init = VFS.init;
  VFS.init = function (u) {
    _init(u);
    VFS.write('/System/Keyboard Shortcuts.txt', shortcutsText());
    VFS.write(VFS.home + '/Desktop/Keyboard Shortcuts.txt', shortcutsText());
  };
}

</script>
<script>OS.boot();</script>
</body>
</html>
